<title>Kairoute</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Outfit:wght@500;700;800&display=swap">
<style>
/* Layout: one mobile-first column like a pocket guidebook; a transit-map route diagram is the signature element. */
:root {
  --paper: #F3F5F1;
  --card: #FFFFFF;
  --ink: #123C3A;
  --muted: #56636C;
  --line: #D8DED8;
  --route: #146B61;
  --route-soft: #DCEEEA;
  --ride: #7B3FE4;
  --meal: #D9532A;
  --meal-soft: #FCE8DF;
  --must: #A8325C;
  --must-soft: #F6E1E8;
  --warn: #9A3B12;
  --font-display: "Outfit", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1418; --card: #161F25; --ink: #E6ECE9; --muted: #9AA8AF; --line: #2A363D;
    --route: #4CC2B0; --route-soft: #143A36; --ride: #C3A0FF; --meal: #F58A62; --meal-soft: #3D2219;
    --must: #EB7EA4; --must-soft: #3E1C29; --warn: #F08A5D; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E1418; --card: #161F25; --ink: #E6ECE9; --muted: #9AA8AF; --line: #2A363D;
  --route: #4CC2B0; --route-soft: #143A36; --ride: #C3A0FF; --meal: #F58A62; --meal-soft: #3D2219;
  --must: #EB7EA4; --must-soft: #3E1C29; --warn: #F08A5D; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h2 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.01em; }
h3 { font-size: 1.1rem; font-weight: 700; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--route); outline-offset: 2px; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); }
.top .wrap { padding-block: 12px 0; display: grid; gap: 10px; }
.brand { display: flex; align-items: baseline; gap: 10px; justify-content: space-between; }
.brand h1 { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.02em; }
.brand h1 span { color: var(--route); }
.brand small { color: var(--muted); font-size: 0.8rem; }
.dayrow { display: flex; gap: 6px; align-items: center; min-width: 0; }
.days { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: thin; padding-bottom: 4px; flex: 1; min-width: 0; scroll-behavior: smooth; }
.dayarrow { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-weight: 800; color: var(--ink); }
.daycount { flex: none; font-size: 0.8rem; color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
.daychip { flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 5px 12px; font-size: 0.85rem; cursor: pointer; }
.daychip b { font-family: var(--font-display); }
.daychip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 4px 9px; font-weight: 700; font-size: 0.92rem; color: var(--muted); cursor: pointer; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--route); }

main .wrap { padding-block: 20px 64px; display: grid; gap: 18px; }
.lede { color: var(--muted); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 14px; min-width: 0; }
.banner { background: var(--route-soft); border-radius: var(--r); padding: 12px 14px; font-size: 0.92rem; display: flex; gap: 10px; align-items: flex-start; }
.banner.warn { background: var(--meal-soft); }
.eyebrow { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }

.field { display: grid; gap: 6px; min-width: 0; }
.field label, .field .lbl { font-weight: 700; font-size: 0.9rem; }
.field .hint { color: var(--muted); font-size: 0.82rem; }
input[type=text], input[type=date], input[type=time], input[type=number], select, textarea {
  width: 100%; border: 1px solid var(--line); background: var(--paper); border-radius: 6px; padding: 10px 12px; min-height: 44px;
}
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 460px) { .row2 { grid-template-columns: 1fr; } }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--paper); border-radius: 6px; padding: 8px 12px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; min-height: 42px; }
.seg button[aria-pressed="true"] { background: var(--route); color: var(--card); border-color: var(--route); font-weight: 700; }
.seg.pace { margin-top: 8px; }
.seg.pace button { padding: 6px 10px; min-height: 38px; font-size: 14px; }
.seg.daylen { align-items: center; margin: 10px 0 4px; }
.seg.daylen .hint { font-size: 14px; margin-right: 2px; }
.seg.daylen small { opacity: .75; font-weight: 500; }
.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.check input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--route); flex: none; }

.btn { border: 0; border-radius: 8px; padding: 12px 18px; font-weight: 700; cursor: pointer; background: var(--route); color: var(--card); min-height: 46px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.small { padding: 8px 12px; min-height: 38px; font-size: 0.9rem; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }

.daycard { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); }
.daycard.active { border-color: var(--route); box-shadow: inset 4px 0 0 var(--route); }
.daycard .meta { color: var(--muted); font-size: 0.85rem; }
.daylist { display: grid; gap: 8px; }

/* Sites */
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.sitelist { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); }
.site { display: grid; grid-template-columns: auto 1fr; gap: 12px; padding: 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); cursor: pointer; }
.site.on { border-color: var(--route); background: color-mix(in srgb, var(--route-soft) 55%, var(--card)); }
.site.nofitcard { cursor: default; opacity: .6; background: var(--paper); border-style: dashed; }
.site.nofitcard .nobox { width: 22px; height: 22px; margin-top: 2px; }
.site.nofitcard .sum { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.site.anchor { border-width: 2px; border-color: var(--route); box-shadow: 0 0 0 3px color-mix(in srgb, var(--route) 18%, transparent); }
.site.flash { animation: anchorflash 1.2s ease-out; }
@keyframes anchorflash { 0% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--route) 40%, transparent); } 100% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--route) 18%, transparent); } }
@media (prefers-reduced-motion: reduce) { .site.flash { animation: none; } }
.anchorbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: .92rem; color: var(--muted); margin-bottom: -6px; }
.anchorbar b { color: var(--ink); }
.listlbl { margin: 4px 0 -6px; font-size: .92rem; font-weight: 700; color: var(--muted); }
.tag.here, .tag.near { background: var(--ink); color: var(--paper); border-color: transparent; font-weight: 700; }
.tag.near { background: var(--route-soft); color: var(--route); }
.site input { width: 22px; height: 22px; accent-color: var(--route); margin-top: 2px; }
.site .body { display: grid; gap: 4px; min-width: 0; align-content: start; }
.site .name { font-weight: 700; font-family: var(--font-display); font-size: 1.05rem; }
.site .sum { color: var(--muted); font-size: 0.92rem; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; align-items: flex-start; }
.tag { font-size: 0.74rem; font-weight: 700; padding: 2px 8px; border-radius: 4px; background: var(--paper); border: 1px solid var(--line); color: var(--muted); letter-spacing: 0.02em; }
.tag.must { background: var(--must-soft); color: var(--must); border-color: transparent; }
.tag.unesco { background: #e8f0fb; color: #1f4f8f; border-color: transparent; }
.grate { display: inline-block; font-size: .85em; color: var(--ink-2, #555); text-decoration: none; margin-top: 2px; }
.grate:hover { text-decoration: underline; }
.grate.none { font-style: italic; }
.checks summary small { color: var(--ink-2, #666); font-weight: normal; margin-left: 6px; }
.checks ul { list-style: none; padding: 0; margin: 8px 0 0; }
.checks .ck { display: flex; gap: 8px; padding: 4px 0; font-size: .92em; }
.checks .ck span { width: 1.2em; flex: none; font-weight: 700; text-align: center; }
.checks .ck.ok span { color: #2e7d4f; }
.checks .ck.warn span { color: #b26a00; }
.checks .ck.unk span { color: #777; }
.srcnote { font-size: .8em; color: var(--ink-2, #666); margin: 4px 0 0; }
.tag.local { background: var(--route-soft); color: var(--route); border-color: transparent; }
.tag.fit { background: var(--route-soft); color: var(--route); border-color: transparent; }
.tag.nofit { background: var(--meal-soft); color: var(--warn); border-color: transparent; }
.travelnote { font-size: 0.85rem; color: var(--muted); }
.stickybar { position: sticky; bottom: 0; padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--paper) 70%, transparent); display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.stickybar .count { font-weight: 700; }

/* Plan */
.summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
@media (max-width: 460px) { .summary { grid-template-columns: repeat(2, 1fr); } }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.stat b { display: block; font-family: var(--font-display); font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 0.8rem; }
.mapbox { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.mapbox svg { display: block; width: 100%; height: auto; }
/* Real street map (MapLibre). The route diagram underneath shows until the map has loaded. */
.mapslot { position: relative; }
.mapslot .kmap { position: absolute; inset: 0; opacity: 0; pointer-events: none; transition: opacity .25s; }
.mapslot.live { aspect-ratio: 8 / 5; min-height: 260px; }
.mapslot.live > svg { visibility: hidden; position: absolute; inset: 0; height: 100%; }
.mapslot.live .kmap { opacity: 1; pointer-events: auto; }
.tourmap .mapslot.live { aspect-ratio: 16 / 9; min-height: 220px; }
.kmap .maplibregl-ctrl-attrib { font-size: 10px; }
.kmap .maplibregl-ctrl-scale { border-color: var(--ink); color: var(--ink); background: color-mix(in srgb, var(--card) 80%, transparent); }
.mk { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 800 12.5px/1 "Atkinson Hyperlegible", system-ui, sans-serif; background: var(--card); color: var(--ink); border: 4px solid var(--route); box-shadow: 0 1px 4px rgba(0,0,0,.35); padding: 0; cursor: default; }
button.mk { cursor: pointer; }
.mk-stop.on { transform: scale(1.25); background: var(--route); color: #fff; }
.mk-meal { border-color: var(--meal); color: var(--meal); width: 24px; height: 24px; font-size: 11px; }
.mk-meal.on { background: var(--meal); color: #fff; transform: scale(1.2); }
.mk-hotel, .mk-start, .mk-end { border-radius: 6px; width: 24px; height: 24px; border: 2px solid var(--card); background: var(--ink); color: var(--paper); font-size: 12px; }
.mk-hotel { background: var(--must); }
.mk-along { width: 14px; height: 14px; border: 2px solid var(--card); background: var(--route); }
.mk-bonus { border-style: dashed; color: var(--route); width: 24px; height: 24px; font-size: 15px; }
.mk-you { width: 18px; height: 18px; border-radius: 50%; background: #1A73E8; border: 3px solid #fff; box-shadow: 0 0 0 6px rgba(26,115,232,.25), 0 1px 4px rgba(0,0,0,.4); }
.maplegend .you { color: #1A73E8; }
.maplegend { display: flex; gap: 14px; flex-wrap: wrap; padding: 10px 14px; border-top: 1px solid var(--line); font-size: 0.82rem; color: var(--muted); }
.maplegend i { display: inline-block; width: 18px; height: 0; border-top: 3px solid var(--route); vertical-align: middle; margin-right: 6px; }
.maplegend i.dash { border-top-style: dashed; border-top-color: var(--ride); }
.timeline { display: grid; }
.tl { display: grid; grid-template-columns: 58px 30px 1fr; column-gap: 8px; }
.tl .time { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 0.9rem; padding-top: 12px; text-align: right; }
.tl .rail { position: relative; display: flex; justify-content: center; }
.tl .rail::before { content: ""; position: absolute; top: 0; bottom: 0; width: 4px; background: linear-gradient(var(--rin, var(--route)) 0 50%, var(--rout, var(--route)) 50% 100%); left: 13px; }
.tl.rin { --rin: var(--ride); } .tl.rout { --rout: var(--ride); }
.tl.first .rail::before { top: 18px; }
.tl.last .rail::before { bottom: calc(100% - 22px); }
.tl.leg .rail::before { background: repeating-linear-gradient(var(--ride) 0 7px, transparent 7px 12px); width: 4px; left: 13px; }
.tl.leg.walk .rail::before { background: var(--route); width: 4px; left: 13px; }
.tl.leg .what { display: flex; align-items: center; gap: 8px; }
.tl.leg.ride .what { color: var(--ride); }
.tl.leg.walk .what { color: var(--route); }
.tl.leg .what b { font-weight: 700; }
.tl.leg.ridecho .what { align-items: flex-start; }
.tl.leg .ridesub { display: block; color: var(--muted); font-size: 0.85rem; margin-top: 2px; }
.tl.leg .ridepick { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 0.85rem; color: var(--muted); }
.tl.leg .ridenote { display: block; margin-top: 4px; padding: 4px 8px; background: var(--warn-bg, rgba(232,120,40,.12)); color: var(--ink, inherit); font-size: 0.85rem; }
.tl.leg .ridepick select { font: inherit; padding: 3px 6px; border-radius: 0; max-width: 100%; }
.legico { width: 20px; height: 20px; flex: none; }
.tourleg { display: flex; align-items: center; gap: 8px; }
.tourleg.ride { color: var(--ride); }
.tourleg .legico { width: 26px; height: 26px; }
.dot { position: relative; z-index: 1; margin-top: 10px; width: 26px; height: 26px; border-radius: 50%; background: var(--card); border: 3px solid var(--route); display: grid; place-items: center; font-size: 0.75rem; font-weight: 800; font-family: var(--font-display); }
.dot.start { border-radius: 6px; background: var(--ink); border-color: var(--ink); color: var(--paper); }
.dot.meal { border-color: var(--meal); color: var(--meal); }
.dot.quick { width: 18px; height: 18px; margin-top: 14px; border-width: 3px; background: var(--route); }
.tl .what { padding: 9px 0 12px; min-width: 0; }
.tl .what .nm { font-weight: 700; }
.tl .what .sub { color: var(--muted); font-size: 0.88rem; }
.tl .what .sub.bonus { color: var(--route); font-weight: 600; }
.dot.bonusdot { border-style: dashed; border-width: 2.5px; color: var(--route); font-size: 16px; }
.tl.optional .what .nm { color: var(--muted); }
.tl .optacts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 6px; }
/* Big stops: what's there, part by part */
.partpick { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin: 6px 0; }
.partpick .eyebrow { width: 100%; }
.partchk { display: inline-flex; gap: 6px; align-items: center; font-size: .9rem; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; background: var(--card); }
.partchk small { color: var(--muted); }
ol.parts { margin: 4px 0 6px; padding-left: 1.3em; font-size: .9rem; }
ol.parts li { margin: 2px 0; }
ol.parts small { color: var(--muted); }
ol.parts .cue { display: block; color: var(--muted); font-style: italic; }
ol.parts .pguide { display: block; margin: 2px 0 4px; }
.partsbox ol.parts li { margin: 0 0 12px; }
.sub.show, .travelnote.show { color: var(--ink); }
ol.partsteps { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; padding: 0; margin: 8px 0; }
ol.partsteps li { border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; font-size: .85rem; color: var(--muted); }
ol.partsteps li.on { border-color: var(--route); color: var(--ink); font-weight: 600; }
ol.partsteps li.done { opacity: .7; }
.tourcard .stand { background: var(--paper); border-left: 3px solid var(--route); padding: 8px 12px; border-radius: 4px; margin: 8px 0; }
.tag.bonus { background: transparent; color: var(--route); border: 1px dashed var(--route); font-weight: 600; }
.tl.leg .what { padding: 2px 0 4px; color: var(--muted); font-size: 0.85rem; }
.tl .what button.link { background: none; border: 0; padding: 0; color: var(--route); font-weight: 700; cursor: pointer; text-align: left; }
.mealbox { background: var(--meal-soft); border-radius: 10px; padding: 10px 12px; margin-top: 6px; display: grid; gap: 4px; }
.mealbox .alt { font-size: 0.85rem; color: var(--muted); }
.tl.evening { border-top: 1px dashed var(--line); margin-top: 6px; padding-top: 10px; }
.tl.evening .rail::before, .tl.evening .rail::after { display: none; }
.bookrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 12px 0 0; font-size: 0.9rem; color: var(--muted); }
.bookform { margin-top: 14px; }
.dayname .rename { font-size: 0.85rem; font-weight: 600; vertical-align: middle; margin-left: 6px; }
.dayrename { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.dayrename input { flex: 1 1 240px; font: inherit; font-size: 1.2rem; font-weight: 700; padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--ink); }
.daychip { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.synccode { font: 800 2rem/1.1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: 0.12em; color: var(--ink); background: var(--meal-soft); border-radius: 8px; padding: 12px 16px; display: inline-block; margin: 6px 0 10px; user-select: all; }
#sync-code { text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; }
.bookform .row2 { display: grid; grid-template-columns: 1fr 140px; gap: 10px; }
.bookform label { display: grid; gap: 4px; font-weight: 600; font-size: 0.9rem; }
.bookform input { font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--ink); }
.bookres { display: grid; gap: 8px; }
.bookres .btn { display: grid; justify-items: start; text-align: left; gap: 2px; }
.bookres small { color: var(--muted); font-weight: 400; }
@media (max-width: 640px) { .bookform .row2 { grid-template-columns: 1fr; } }
.dropped { font-size: 0.9rem; }

/* Guide */
.stoplist { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); align-items: start; }
.stopcard { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.postcard { position: relative; aspect-ratio: 16 / 7; max-width: 100%; display: block; }
.postcard svg { width: 100%; height: 100%; display: block; }
.postcard .num { position: absolute; left: 14px; top: 12px; width: 38px; height: 38px; border-radius: 50%; background: var(--card); color: var(--ink); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; }
.postcard .cat { position: absolute; right: 14px; top: 16px; background: color-mix(in srgb, var(--card) 85%, transparent); padding: 3px 10px; border-radius: 6px; font-size: 0.78rem; font-weight: 700; }
.stopbody { padding: 16px; display: grid; gap: 14px; min-width: 0; }
.stopbody .head { display: grid; gap: 4px; }
.lookfor { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; counter-reset: lf; }
.lookfor li { counter-increment: lf; display: grid; grid-template-columns: 26px 1fr; gap: 8px; }
.lookfor li::before { content: counter(lf); width: 24px; height: 24px; border-radius: 50%; background: var(--must-soft); color: var(--must); font-weight: 800; font-size: 0.8rem; display: grid; place-items: center; }
.guidetext { max-width: 65ch; display: grid; gap: 10px; }
.guidetext p { font-size: 1.02rem; }
.audio { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.audio .state { color: var(--muted); font-size: 0.85rem; }
.syncjoin { display: grid; gap: 8px; }

}

/* ---------- Lobby, settings, legal, brand film ---------- */

.k-mark { display: block; overflow: visible; }
.k-mark .k-stem, .k-mark .k-leg { fill: var(--k-ink, #123C3A); stroke: var(--k-ink, #123C3A); }
.k-mark .k-leg { fill: none; }
.k-mark .k-dot { fill: #F0643A; }
.k-mark .k-ring { fill: none; stroke: #F0643A; }
.k-anim .k-stem { transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(0); animation: kStem .7s cubic-bezier(.2,.8,.2,1) .15s forwards; }
.k-anim .k-leg { stroke-dasharray: 1; stroke-dashoffset: 1; animation: kDraw .6s ease-out .7s forwards; }
.k-anim .k-dot { transform-box: fill-box; transform-origin: center; transform: scale(0); animation: kPop .35s cubic-bezier(.3,1.6,.5,1) forwards; }
.k-anim .k-dot:nth-of-type(1) { animation-delay: 1.15s; } .k-anim .k-dot:nth-of-type(2) { animation-delay: 1.3s; }
.k-anim .k-dot:nth-of-type(3) { animation-delay: 1.45s; } .k-anim .k-dot:nth-of-type(4) { animation-delay: 1.6s; }
.k-anim .k-ring { stroke-dasharray: 1; stroke-dashoffset: 1; animation: kDraw .5s ease-out 1.8s forwards; }
@keyframes kStem { to { transform: scaleY(1); } }
@keyframes kDraw { to { stroke-dashoffset: 0; } }
@keyframes kPop { to { transform: scale(1); } }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
