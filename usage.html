<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Kairoute Usage & Cost</title>
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: one column of meters, summary first; Kairoute green with sunrise orange for warnings. */
:root {
  --bg: #F3F6F5; --card: #FFFFFF; --ink: #10201F; --muted: #5A6B69; --line: #DCE5E3;
  --brand: #123C3A; --bar: #2E8B7E; --warn: #E07A1F; --bad: #C2412D; --ok: #2E7D4F;
  --display: "Space Grotesk", system-ui, sans-serif; --body: Inter, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0D1716; --card: #152321; --ink: #E7EFEE; --muted: #9AAEAB; --line: #26403C; --brand: #9FD8CF; --bar: #4DB6A6; --warn: #F2A154; --bad: #F07A66; --ok: #6CC79A; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #0D1716; --card: #152321; --ink: #E7EFEE; --muted: #9AAEAB; --line: #26403C; --brand: #9FD8CF; --bar: #4DB6A6; --warn: #F2A154; --bad: #F07A66; --ok: #6CC79A; color-scheme: dark }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
main { max-width: 720px; margin: 0 auto; padding-block: 24px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; }
h1 { font: 700 26px/1.2 var(--display); margin: 0; color: var(--brand); text-wrap: balance; }
.sub { color: var(--muted); margin: 4px 0 0; }
.total { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 6px; }
.total .big { font: 700 40px/1 var(--display); font-variant-numeric: tabular-nums; }
.total .lbl { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
.alerts { display: grid; gap: 8px; }
.alert { border-radius: 10px; padding: 10px 12px; border: 1px solid var(--warn); color: var(--ink); background: color-mix(in srgb, var(--warn) 12%, var(--card)); }
.alert.bad { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--card)); }
.alert.ok { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 10%, var(--card)); }
.meters { display: grid; gap: 12px; }
.m { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 8px; min-width: 0; }
.m .row { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; }
.m h2 { font: 600 16px/1.3 var(--display); margin: 0; }
.m .num { font-variant-numeric: tabular-nums; font-weight: 600; }
.m .note { color: var(--muted); font-size: 13px; margin: 0; }
.track { height: 10px; border-radius: 6px; background: var(--line); overflow: hidden; }
.fill { height: 100%; border-radius: 6px; background: var(--bar); width: 0; transition: width .4s; }
.fill.warn { background: var(--warn); } .fill.bad { background: var(--bad); }
.chart { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.chart h2 { font: 600 16px/1.3 var(--display); margin: 0 0 8px; }
.chart svg { width: 100%; height: auto; display: block; }
.foot { color: var(--muted); font-size: 13px; }
button { font: 600 14px var(--body); border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; padding: 8px 14px; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--bar); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .fill { transition: none; } }
</style>
</head>
<body>
<main>
  <header><h1>Kairoute usage &amp; cost</h1><p class="sub" id="when">Loading today's numbers…</p></header>
  <section class="total" aria-live="polite"><span class="lbl">Estimated cost this month</span><span class="big" id="usd">…</span><span class="note" id="usdNote"></span></section>
  <section class="alerts" id="alerts"></section>
  <section class="meters" id="meters"></section>
  <section class="chart"><h2>AI use, last 14 days (neurons)</h2><div id="chart"></div></section>
  <p class="foot">Counts only, nothing about travelers. The numbers update every minute while this page is open. AI daily use resets at midnight UTC (7 pm Central). <button id="refresh" type="button">Refresh now</button></p>
</main>
<script>
const fmt = n => Math.round(n).toLocaleString(), money = n => "$" + n.toFixed(2);
let base = "https://kairoute-ai.rickgilson.workers.dev";
async function load() {
  try { const a = await fetch("ai.json", { cache: "no-store" }); if (a.ok) { const j = await a.json(); if (j.url) base = j.url; } } catch (e) {}
  let u; try { const r = await fetch(base + "/usage", { cache: "no-store" }); u = await r.json(); } catch (e) { document.getElementById("when").textContent = "Couldn't reach the Kairoute helper. Try Refresh in a minute."; return; }
  const aiUSD = u.ai.extraMonth / 1000 * u.ai.usdPer1000, gOver = Math.max(0, u.google.month - u.google.free) * u.google.usdEach;
  document.getElementById("usd").textContent = money(5 + aiUSD + gOver);
  document.getElementById("usdNote").textContent = `Cloudflare Workers Paid plan $5.00 (shared with your other apps) + Kairoute AI beyond the free share ${money(aiUSD)} + Google ratings ${money(gOver)} (free up to ${fmt(u.google.free)} a month).`;
  document.getElementById("when").textContent = "As of " + new Date(u.at).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }) + " · month " + u.month;
  const meters = [
    { t: "AI today", v: u.ai.today, cap: u.ai.freeShare, note: `Free share is ${fmt(u.ai.freeShare)} neurons a day. Today's hard stop is ${fmt(u.ai.limitToday)}.` },
    { t: "AI beyond the free share, this month", v: u.ai.extraMonth, cap: u.ai.extraCap, note: `Hard stop at ${fmt(u.ai.extraCap)} neurons, about ${money(u.ai.extraCap / 1000 * u.ai.usdPer1000)}. Includes test runs.` },
    { t: "Guide voice today", v: u.voice.today, cap: u.voice.freeDaily, note: u.voice.paidOn ? "Paid voice is on." : "Paid voice is paused, so voice stays inside the free daily amount." },
    { t: "Google ratings this month", v: u.google.month, cap: u.google.cap, note: `${fmt(u.google.today)} today. Kairoute stops at ${fmt(u.google.cap)}; Google's free amount is ${fmt(u.google.free)} a month.${u.google.keyOn ? "" : " The Google key isn't set up."}` }
  ];
  const alerts = [];
  document.getElementById("meters").innerHTML = meters.map(m => { const p = m.cap ? m.v / m.cap : 0, cls = p >= 1 ? "bad" : p >= 0.8 ? "warn" : "";
    if (p >= 0.8) alerts.push(`<div class="alert ${p >= 1 ? "bad" : ""}"><b>${m.t}:</b> ${Math.round(p * 100)}% used${p >= 1 ? ". It has reached its stop, so new requests wait until it resets." : ". Getting close to its stop."}</div>`);
    return `<div class="m"><div class="row"><h2>${m.t}</h2><span class="num">${fmt(m.v)} / ${fmt(m.cap)}</span></div><div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="${m.cap}" aria-valuenow="${Math.round(m.v)}" aria-label="${m.t}"><div class="fill ${cls}" style="width:${Math.min(100, p * 100).toFixed(1)}%"></div></div><p class="note">${m.note}</p></div>`; }).join("");
  document.getElementById("alerts").innerHTML = alerts.length ? alerts.join("") : `<div class="alert ok">Everything is under 80% of its limit.</div>`;
  // 14-day bars against the 8,500 daily free share
  const H = u.history, W = 640, Ht = 180, padL = 44, padB = 28, max = Math.max(u.ai.freeShare, ...H.map(x => x.neurons)) * 1.1, bw = (W - padL - 8) / H.length;
  const y = v => Ht - padB - v / max * (Ht - padB - 10), share = y(u.ai.freeShare);
  document.getElementById("chart").innerHTML = `<svg viewBox="0 0 ${W} ${Ht}" role="img" aria-label="Daily AI use for the last 14 days">
    <line x1="${padL}" x2="${W - 4}" y1="${share}" y2="${share}" stroke="var(--warn)" stroke-dasharray="4 4" />
    <text x="${padL - 6}" y="${share + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${(u.ai.freeShare / 1000).toFixed(1)}k</text>
    <text x="${padL - 6}" y="${Ht - padB + 4}" text-anchor="end" font-size="11" fill="var(--muted)">0</text>
    ${H.map((d, i) => { const x = padL + i * bw + 3, top = y(d.neurons); return `<rect x="${x}" y="${top}" width="${bw - 6}" height="${Math.max(0, Ht - padB - top)}" rx="3" fill="${d.neurons > u.ai.freeShare ? "var(--warn)" : "var(--bar)"}"><title>${d.date}: ${fmt(d.neurons)} neurons</title></rect>` + (i % 2 === 0 || i === H.length - 1 ? `<text x="${x + (bw - 6) / 2}" y="${Ht - 10}" text-anchor="middle" font-size="11" fill="var(--muted)">${d.date.slice(5)}</text>` : ""); }).join("")}
  </svg><p class="note" style="color:var(--muted);font-size:13px;margin:6px 0 0">Daily totals are recorded from Nov 12, 2026. The dashed line is Kairoute's free daily share.</p>`;
}
document.getElementById("refresh").addEventListener("click", load);
load(); setInterval(load, 60000);
</script>
</body>
</html>
