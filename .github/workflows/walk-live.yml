name: Walk-through live check
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["tools/walk-live.cjs"]
permissions:
  contents: read
jobs:
  walk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the app (the repository's index.html is only a placeholder)
        run: sh build.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - run: node tools/walk-live.cjs
