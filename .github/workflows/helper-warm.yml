name: Warm the live helper's kept answers
on:
  push:
    branches: ["claude/project-thread-65fiyt"]
    paths: ["tools/helper-warm.cjs", ".github/workflows/helper-warm.yml"]
  workflow_dispatch:
    inputs:
      canary_only:
        description: "Only ask cold cities the way the app does (no warming)"
        default: "false"
      cities:
        description: "Canary cities (a|b|c); empty = the next slice of the list"
        default: ""
permissions:
  contents: read
jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cold cities get their guide the way the app asks (R-34 canary)
        env:
          CANARY_CITIES: ${{ github.event.inputs.cities }}
        run: node tools/helper-canary.cjs 10
      - if: always() && github.event.inputs.canary_only != 'true'
        run: node tools/helper-warm.cjs
