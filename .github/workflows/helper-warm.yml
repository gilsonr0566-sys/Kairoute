name: Warm the live helper's kept answers
on:
  push:
    branches: ["claude/project-thread-65fiyt"]
    paths: ["tools/helper-warm.cjs", ".github/workflows/helper-warm.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/helper-warm.cjs
