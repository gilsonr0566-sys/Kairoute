name: Deploy AI helper
# Puts a change to the AI helper (worker/) live at once, without waiting for the website's checks, so a spend
# switch or limit takes effect within a minute. "Publish website" deploys the same code again after its checks.
on:
  push:
    branches: [main]
    paths: ["worker/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: worker-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Helper security and spend checks (offline)
        run: node tools/worker-check.mjs && node tools/worker-ai-gate.mjs
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: cd worker && npx -y wrangler@4 deploy
      - name: The live helper's AI switch matches wrangler.toml
        run: |
          sleep 15
          curl -s https://kairoute-ai.rickgilson.workers.dev/status | tee status.json; echo
          if grep -q '^AI_ON = "1"' worker/wrangler.toml; then grep -q '"on":true' status.json; else grep -q '"on":false' status.json; fi
      - name: Live minimal-AI guards refuse before the AI (costs nothing)
        run: |
          H=https://kairoute-ai.rickgilson.workers.dev
          if ! grep -q '^AI_MODE = "minimal"' worker/wrangler.toml; then echo "Not in minimal mode"; exit 0; fi
          if grep -q '^AI_ON = "1"' worker/wrangler.toml; then
            grep -q '"mode":"minimal"' status.json && grep -q '"budget":3000' status.json || { echo "FAIL live helper is not in minimal mode with a 3,000 cap"; exit 1; }
          fi
          # A job outside the minimal list, a test request and a photo ask: each must be refused, never run.
          s1=$(curl -s -o /dev/null -w '%{http_code}' -X POST $H/sample -H 'content-type: application/json' -d '{"prompt":"Say hi in five words, live guard check '"$RANDOM"'","purpose":"walk","tier":"quick"}')
          s2=$(curl -s -o /dev/null -w '%{http_code}' -X POST $H/sample -H 'content-type: application/json' -H 'x-kairoute-lab: 1' -d '{"prompt":"Say hi in five words, live guard check '"$RANDOM"'","purpose":"trip","tier":"quick"}')
          s3=$(curl -s -o /dev/null -w '%{http_code}' -X POST $H/speak -H 'content-type: application/json' -d '{"text":"Hello there, live guard check."}')
          echo "other job: $s1, test request: $s2, new voice line: $s3"
          [ "$s1" = 403 ] || grep -q '^AI_ON = "0"' worker/wrangler.toml || { echo FAIL; exit 1; }
          [ "$s2" != 200 ] && [ "$s3" != 200 ] || { echo "FAIL a guard let a call through"; exit 1; }
          curl -s $H/status; echo
      # The city list (place files, built-in guides) lives on the Beta 2 release branch, not on main (Nov 24: the first
      # warm after a deploy stopped at once with no tools/places/data).
      - uses: actions/checkout@v4
        if: always()
        with: { ref: claude/project-thread-xrdp7v, path: rel }
      - name: Warm every known city's kept answers (a deploy starts them all cold; R-29)
        if: always()
        run: node rel/tools/helper-warm.cjs
