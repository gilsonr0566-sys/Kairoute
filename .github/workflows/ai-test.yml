name: Test AI helper
on:
  workflow_dispatch:
    inputs:
      cities:
        description: Cities separated by |
        default: "Lisbon|Kotor, Montenegro|Savannah, Georgia"
      store_only:
        description: Only test the guide store
        default: ""
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          CITIES: ${{ inputs.cities }}
          VERBOSE: "1"
          STORE_ONLY: ${{ inputs.store_only }}
        run: echo '{"url":"https://kairoute-ai.rickgilson.workers.dev"}' > ai.json && node tools/ai-test.mjs
