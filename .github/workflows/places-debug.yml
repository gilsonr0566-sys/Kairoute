name: Debug places
on:
  workflow_dispatch:
    inputs:
      city:
        default: "Kotor"
      names:
        default: ""
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          CITY: ${{ inputs.city }}
          NAMES: ${{ inputs.names }}
        run: node tools/places-debug.mjs
