name: Sight audit
# Every sight the Beta 2 app offers on the test places, checked against Wikidata and OpenStreetMap (positions, names,
# duplicates, non-sights, parts of bigger sights, visit lengths, must-sees). Runs the app with AI off against the live
# helper's free lookups only. Never publishes anything; commits the dumps and the report to the branch it ran on.
on:
  workflow_dispatch:
  push:
    branches: ["claude/project-thread-65fiyt"]
    paths: ["tools/beta2/sight-audit.cjs", ".github/workflows/sight-audit.yml", "tools/beta2/sight-audit/run.txt"]
permissions:
  contents: write
jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        batch: ["0", "1", "2", "3", "4", "5", "6", "7"]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash build-beta2.sh
      - run: npm i --no-save playwright@1.65.1 && npx playwright install --with-deps chromium
      - name: Run the app on each place and keep its sights
        env:
          BATCH: ${{ matrix.batch }}
        run: node tools/beta2/sight-audit.cjs dump beta2-site/index.html
      - name: Check every sight against Wikidata and the map
        if: always()
        env:
          BATCH: ${{ matrix.batch }}
        run: node tools/beta2/sight-audit.cjs audit
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sight-audit-${{ matrix.batch }}
          path: tools/beta2/sight-audit/
  keep:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: got
      - run: |
          mkdir -p tools/beta2/sight-audit && cp got/*/* tools/beta2/sight-audit/ 2>/dev/null || true
          cat tools/beta2/sight-audit/report-*.md > tools/beta2/sight-audit/report.md || true
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/beta2/sight-audit; git diff --cached --quiet || { git commit -m "Sight audit results"; git pull --rebase && git push; }
