name: Sight audit
# Every sight the Beta 2 app offers on the test places, checked against Wikidata and OpenStreetMap (positions, names,
# duplicates, non-sights, parts of bigger sights, visit lengths, must-sees). Runs the app with AI off against the live
# helper's free lookups only. Never publishes anything; commits the dumps and the report to the branch it ran on.
# Weekly too (Sunday 14:00 UTC, before Monday's Fable round): a scheduled run fires only from main, and saves to the
# branch sight-audit-weekly so main gets no commits. It ends with summary.md: counts by kind and what is new this week.
on:
  schedule:
    - cron: "0 14 * * 0"
  workflow_dispatch:
  push:
    branches: ["claude/project-thread-65fiyt"]
    paths: ["tools/beta2/sight-audit.cjs", ".github/workflows/sight-audit.yml", "tools/beta2/sight-audit/run.txt"]
permissions:
  contents: write
env:
  SAVE: ${{ github.event_name == 'schedule' && 'sight-audit-weekly' || github.ref_name }}
jobs:
  # One place per job, each saving its own results to the branch the moment it is done, so a time limit or a slow
  # lookup loses at most that one place (Nov 23: 8 batches of 4 ran 3 hours and the merge step kept only one batch).
  run:
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        place: [istanbul, vienna, lisbon, barcelona, edinburgh, kyoto, lehavre, southampton, kotor, dubrovnik, juneau, ketchikan, grandturk, mykonos, pontadelgada, halfmooncay, haifa, reykjavik, venice, dubai, athens, santorini, heraklion, chania, kusadasi, messina, naples, rome, madrid, nassau, cococay, hamburg]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash build-beta2.sh
      - run: npm i --no-save playwright@1.65.1 && npx playwright install --with-deps chromium
      - name: Run the app on the place and keep its sights (the helper's code from this branch, run locally)
        env:
          ONLY: ${{ matrix.place }}
          HELPER_URL: http://localhost:8790/workers.dev
        run: |
          (node tools/beta2/local-helper.mjs 8790 > local-helper.log 2>&1 &); sleep 2
          node tools/beta2/sight-audit.cjs dump beta2-site/index.html
      - name: Check every sight against Wikidata and the map
        timeout-minutes: 70
        env:
          ONLY: ${{ matrix.place }}
        run: node tools/beta2/sight-audit.cjs audit
      - name: Save this place's results to the branch
        if: always()
        env:
          P: ${{ matrix.place }}
        run: |
          mkdir -p /tmp/keep && cp tools/beta2/sight-audit/$P.* tools/beta2/sight-audit/report-$P.md /tmp/keep/ 2>/dev/null || true
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5 6; do
            if git fetch -q origin "$SAVE"; then git reset -q --hard "origin/$SAVE"; fi
            cp /tmp/keep/* tools/beta2/sight-audit/ 2>/dev/null || true
            rm -f tools/beta2/sight-audit/report-[0-9].md tools/beta2/sight-audit/report-all.md
            cat tools/beta2/sight-audit/report-*.md > tools/beta2/sight-audit/report.md 2>/dev/null || true
            git add -A tools/beta2/sight-audit
            git diff --cached --quiet && break
            git commit -qm "Sight audit: $P" && git push -q origin "HEAD:$SAVE" && break
            sleep $((RANDOM % 20 + 5))
          done
  # Counts by kind for each place and the findings new since the last summary (tools/beta2/sight-audit-summary.cjs).
  summary:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Summarise and save
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5 6; do
            if git fetch -q origin "$SAVE"; then git reset -q --hard "origin/$SAVE"; fi
            node tools/beta2/sight-audit-summary.cjs > /tmp/summary.md
            git add -A tools/beta2/sight-audit
            git diff --cached --quiet && break
            git commit -qm "Sight audit summary" && git push -q origin "HEAD:$SAVE" && break
            sleep $((RANDOM % 20 + 5))
          done
          cat /tmp/summary.md >> "$GITHUB_STEP_SUMMARY"
