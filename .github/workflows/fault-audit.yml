name: Fault audit
# Do the checks catch bugs nobody has thought of? (Richard, Nov 24 2026: "Either that means we are ready or there is
# fault in our pass testing.") Plants random small bugs in the planner, one at a time, and counts what share the release
# gate's checks catch, area by area (docs/qa/READINESS.md: the target is 90% in every area). Weekly, and on a change to
# the audit itself. Reports only; never publishes.
on:
  workflow_dispatch:
    inputs:
      seed: { description: "Seed (empty: the week number)", required: false }
  push:
    branches: [claude/project-thread-bw3ktc]
    paths: [tools/truth/fault-audit.cjs, .github/workflows/fault-audit.yml]
  schedule:
    - cron: "0 9 * * 0" # Sunday 3 am Central, before Monday's outside test
permissions:
  contents: read
jobs:
  area:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        area: [leave-by, rides, day planning, opening hours, names, screen rules]
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event_name == 'schedule' && 'claude/project-thread-xrdp7v' || github.ref }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save opening_hours@3.16.0
      - name: Plant random bugs in ${{ matrix.area }} and run the gate's checks on each
        run: |
          mkdir -p tools/beta2/snapshots && cp tools/beta2/corpus/*.json tools/beta2/snapshots/
          SEED="${{ github.event.inputs.seed }}"; [ -n "$SEED" ] || SEED=$(date -u +%V)
          node tools/truth/fault-audit.cjs --area "${{ matrix.area }}" --per 20 --seed $SEED --lanes 4 --out fault.json 2>&1 | tee fault.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "fault-${{ strategy.job-index }}", path: "fault.*" }
