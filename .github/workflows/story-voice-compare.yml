name: Story voice compare (Kokoro vs saved Aurora)
on:
  push:
    branches: [ "claude/**" ]
    paths: [ "stories/tools/compare-voices.mjs" ]
  workflow_dispatch:
    inputs:
      voices: { description: "Kokoro voices", default: "af_heart af_bella bf_emma am_michael bm_george" }
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: cd stories/tools && npm init -y >/dev/null && npm install --no-audit --no-fund kokoro-js@1.2.1 --onnxruntime-node-install-cuda=skip
      - run: node stories/tools/compare-voices.mjs "${{ github.event.inputs.voices || 'af_heart af_bella bf_emma am_michael bm_george' }}"
      - run: |
          git config user.name "kairoute-bot"; git config user.email "actions@users.noreply.github.com"
          git add stories/compare
          git commit -m "Story voice: Kokoro comparison recordings" || exit 0
          git pull --rebase -q && git push
