name: Check ratings on a day plan
on:
  workflow_dispatch:
    inputs:
      day:
        default: "1"
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          DAY: ${{ inputs.day }}
        run: npm i playwright@1 && npx playwright install chromium && node tools/ratings-e2e.cjs
