name: AI spend check
# Hourly: Cloudflare's real Workers AI numbers. Sends today's real total to the helper (a second spend guard) and
# opens an issue for Richard at 80% of the $5 monthly cap, or if any AI ran while switched off.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: ai-spend
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Real AI spend (Cloudflare analytics)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          export REC_KEY=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -c1-40)
          node tools/ai-spend.mjs
