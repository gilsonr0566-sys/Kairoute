name: Voice hearted stops slowly
# Richard (Nov 17): voice slowly between now and the June trip, keep the monthly AI cost under $5, only hearted stops,
# and only scripts that are locked down. Every night just before the free AI allowance resets (00:00 UTC), records a
# few paragraphs of locked scripts for hearted stops, in trip order (tools/voice-drip.mjs). The helper itself refuses
# once the drip's free share, its ~$1 a month, or ~$2 of the month's AI spend is reached. Pauses: tools/voice-drip.json.
# Recordings are saved with the code; the next "Publish website" puts them live (this push doesn't start it).
on:
  schedule:
    - cron: "20 23 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: voice-drip
jobs:
  drip:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node tools/voice-drip.mjs
      - name: Save the recordings and the progress report
        run: |
          git add audio reports/voice-drip.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nothing new to save."; exit 0; fi
          git -c user.name="Kairoute recorder" -c user.email="actions@users.noreply.github.com" commit -m "Voice hearted stops (slow drip)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push origin HEAD:main && exit 0; sleep 5; done; exit 1
