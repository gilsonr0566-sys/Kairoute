name: Probe sources
on:
  workflow_dispatch:
    inputs:
      cities:
        default: ""
      pts:
        description: "Island probe points name:lat,lng|... (runs tools/islands-probe.mjs instead)"
        default: ""
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          CITIES: ${{ inputs.cities }}
          PTS: ${{ inputs.pts }}
        run: if [ -n "$PTS" ]; then node tools/islands-probe.mjs; else node tools/probe.mjs; fi
