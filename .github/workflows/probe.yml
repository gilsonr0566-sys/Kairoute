name: Probe sources
on:
  workflow_dispatch:
    inputs:
      cities:
        default: ""
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm i --no-save playwright@1 && npx playwright install --with-deps chromium
          curl -sS https://gilsonr0566-sys.github.io/Kairoute/ -o live.html && node tools/area-check.cjs live.html
          node tools/area-live.cjs
