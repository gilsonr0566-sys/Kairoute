name: Record stop scripts in the Kairoute voices (free Kokoro)
# Build time only: Kokoro (Apache 2.0) records each hand-written stop script in every guide voice on GitHub's
# machines. No paid service and no AI inside the app: travelers' phones only play the saved files.
on:
  workflow_dispatch:
    inputs:
      script: { description: "One script id (blank = all)", default: "" }
  push:
    branches: [ "claude/**" ]
    paths: [ "src/features/stop-scripts.js", "src/features/stop-stories.js", "stories/tools/record-scripts.mjs", ".github/workflows/script-voices.yml" ]
permissions:
  contents: write
  actions: write
concurrency:
  group: script-voices-${{ github.ref }}
  cancel-in-progress: false # a run started while one is going waits for it (GitHub keeps only the newest waiting run)
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        voice: [ af_heart, af_bella, bf_emma, am_michael, bm_george ] # Clara, Maya, Eleanor, Daniel, Henry (GUIDES in main.js)
        shard: [ 0, 1, 2 ] # each job records every third script, so a big library records in parallel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: cd stories/tools && npm init -y >/dev/null && npm install --no-audit --no-fund kokoro-js@1.2.1 --onnxruntime-node-install-cuda=skip
      - name: Record
        run: node stories/tools/record-scripts.mjs "${{ matrix.voice }}" "${{ github.event.inputs.script }}"
        env: { SHARD: "${{ matrix.shard }}/3", REC_MINUTES: "110" }
      - run: |
          git config user.name "kairoute-bot"; git config user.email "actions@users.noreply.github.com"
          git add audio
          git commit -m "Recorded stories: Kokoro ${{ matrix.voice }} $(date -u +%F)" || exit 0
          for i in 1 2 3 4 5 6 7 8; do git pull --rebase -q -X theirs && git push && break; sleep $((i * 7)); done
      - name: Run again for what is left
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if [ -f /tmp/more-to-record ]; then gh api -X POST "repos/${{ github.repository }}/actions/workflows/script-voices.yml/dispatches" -f ref="${{ github.ref_name }}" || true; fi
