name: Build full guides for thin example cities
on:
  workflow_dispatch:
    inputs:
      rebuild:
        description: Cities to write fresh, separated by |
        default: ""
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          REBUILD: ${{ inputs.rebuild }}
        run: npm i playwright@1 && npx playwright install chromium && node tools/upgrade-thin.cjs
