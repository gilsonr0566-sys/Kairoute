name: Build Android app
on:
  push:
    branches: [main]
    paths: ["src/**", "app/**", "build.sh", "icons/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build the web app
        run: sh build.sh
      - name: Copy it into the Android project
        working-directory: app
        run: npm ci && npm run sync
      - name: Build the APK
        working-directory: app/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Save the APK for download
        uses: actions/upload-artifact@v4
        with:
          name: Kairoute-android
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
