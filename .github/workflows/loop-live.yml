name: Loop live check
on:
  workflow_dispatch:
    inputs:
      site:
        description: "live = the published site, branch = this branch's build"
        default: "live"
  push:
    paths: ["tools/loop-live.cjs"]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Serve this branch's build
        if: ${{ github.event.inputs.site == 'branch' || github.event_name == 'push' }}
        run: |
          sh build.sh
          nohup python3 -m http.server 8080 >/dev/null 2>&1 &
          sleep 2 && curl -sf http://localhost:8080/ >/dev/null
          echo "URL=http://localhost:8080/" >> "$GITHUB_ENV"
      - run: npm i --no-save playwright@1.65.1 && npx playwright install --with-deps chromium
      - run: node tools/loop-live.cjs
