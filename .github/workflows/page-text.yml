name: Read a live page
on:
  workflow_dispatch:
    inputs:
      url:
        default: "https://gilsonr0566-sys.github.io/Kairoute/usage.html"
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the app (the repository's index.html is only a placeholder)
        run: sh build.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          URL: ${{ inputs.url }}
        run: npm i playwright@1 && npx playwright install chromium && node tools/page-text.cjs
