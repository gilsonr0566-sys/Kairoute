name: Places opening hours of places to eat
# Refreshes only the opening hours of the named places to eat near each place's sights in the saved places files, from
# OpenStreetMap. Free source, no AI, never publishes anything. The refreshed places files are saved back to this
# branch (tools/places/data only, marked [skip ci]), merged with what was there so no fact found before is lost.
on:
  workflow_dispatch:
    inputs:
      refresh:
        description: "Parts to refresh: transit, ports, see, lifts, hours, eats, piers, roads, islands"
        default: "eathours"
      only:
        description: "Only places whose key matches (blank: all)"
        default: ""
  push:
    branches: ["claude/project-thread-h50p7p"]
    paths: [".github/workflows/places-eathours.yml"]
permissions:
  contents: write
jobs:
  lines:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        # The places not yet refreshed (Nov 23: the first run stopped at its time limit after 17), in three groups so each
        # finishes well within the limit; a manual run with "only" set runs that one group.
        group: ["paris", "hamburg|venice|prague|reykjavik|southampton|dubai", "dubrovnik|example cay|grand turk|half moon|jerusalem|juneau|ketchikan|kotor|nassau|cococay|ponta delgada"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          REFRESH: ${{ inputs.refresh || 'eathours' }}
          PLACES_EXTRA: "1"
          ONLY: ${{ inputs.only || matrix.group }}
        run: node tools/places/build.cjs
      - name: Save the places files to the branch
        run: |
          git config user.name "Kairoute places"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/places/data
          git diff --cached --quiet && exit 0
          git commit -m "Places: refreshed ${{ inputs.refresh || 'eathours' }} for ${{ inputs.only || matrix.group }} [skip ci]"
          for n in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0; sleep 5; done; exit 1
