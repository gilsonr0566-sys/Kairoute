name: Day trip probe
# Probes for the day-trips rule (thread "Add classic day trips to every city guide"). Reads free sources only; publishes nothing.
on:
  push:
    branches: ["claude/project-thread-s5o355"]
    paths: ["tools/beta2/probe/daytrips/**", ".github/workflows/daytrip-probe.yml"]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: for f in tools/beta2/probe/daytrips/*.mjs; do echo "=== $f"; node $f; done
