name: AI usage
on:
  workflow_dispatch:
    inputs:
      since:
        description: First day (YYYY-MM-DD)
        default: ""
permissions:
  contents: read
jobs:
  usage:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SINCE: ${{ inputs.since }}
        run: node tools/cf-usage.mjs
