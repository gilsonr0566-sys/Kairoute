name: List guide sights
on: workflow_dispatch
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the app (the repository's index.html is only a placeholder)
        run: sh build.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i playwright@1 && npx playwright install chromium && node tools/dump-sights.cjs
