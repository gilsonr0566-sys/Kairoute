name: Helper traffic sample
# Listens to the live AI helper for a few minutes (wrangler tail, free) and counts requests by path and caller,
# to see what drives its request and storage use. Prints counts only, nothing about travelers.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: How long to listen
        default: "6"
  push:
    branches: [claude/project-thread-0tz5s8]
    paths: [".github/workflows/helper-tail.yml"]
permissions:
  contents: read
jobs:
  tail:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Listen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          M=${{ github.event.inputs.minutes || '6' }}
          timeout $((M*60)) npx -y wrangler@4 tail kairoute-ai --format json > tail.jsonl 2>/dev/null || true
          node -e '
            const L=require("fs").readFileSync("tail.jsonl","utf8").split(/\n(?=\{)/).filter(Boolean);const c={},o={},ua={};let n=0;
            for(const l of L){let j;try{j=JSON.parse(l)}catch(e){continue}const r=j.event&&j.event.request;if(!r){const k="cron/"+(j.event&&j.event.cron||"?");c[k]=(c[k]||0)+1;continue}n++;
              const u=new URL(r.url),k=r.method+" "+u.pathname.replace(/\/x\/.*/,"/x/*");c[k]=(c[k]||0)+1;const or=(r.headers&&(r.headers.origin||r.headers.Origin))||"(none)";o[or]=(o[or]||0)+1;
              const a=(r.headers&&r.headers["user-agent"]||"").replace(/[\d.]+/g,"").slice(0,60);ua[a]=(ua[a]||0)+1;}
            const s=x=>Object.entries(x).sort((a,b)=>b[1]-a[1]).slice(0,25).map(([k,v])=>"  "+v+"  "+k).join("\n");
            console.log("requests: "+n+"\nBY PATH\n"+s(c)+"\nBY ORIGIN\n"+s(o)+"\nBY BROWSER\n"+s(ua));'
