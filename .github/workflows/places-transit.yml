name: Places public transport lines
# Refreshes only the public transport lines (metro, light rail, tram, train) in the saved places files, from
# OpenStreetMap. Free source, no AI, never publishes anything. Lines are printed back as PLACES lines for replay
# (gathered in tools/places/data after each run).
on:
  workflow_dispatch:
    inputs:
      refresh:
        description: "Parts to refresh: transit, ports, see, lifts, hours"
        default: "transit,ports"
      only:
        description: "Only places whose key matches (blank: all)"
        default: ""
  push:
    branches: ["claude/project-thread-xrdp7v"]
    paths: [".github/workflows/places-transit.yml", "tools/places/targets.json"]
permissions:
  contents: read
jobs:
  lines:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          REFRESH: ${{ inputs.refresh || 'transit,ports' }}
          PLACES_EXTRA: "1"
          ONLY: ${{ inputs.only || '' }}
        run: node tools/places/build.cjs
