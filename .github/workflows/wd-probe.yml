name: Wikidata probe
on:
  push:
    branches: ["claude/project-thread-65fiyt"]
    paths: ["tools/beta2/probe/**"]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: for f in tools/beta2/probe/*.mjs; do echo "=== $f"; node $f; done
