name: Offline test
on:
  push:
    paths: ["src/**", "!src/engine/**", "sw.js", "build.sh", "tools/offline-e2e.cjs"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Bring back the test stand-in's kept answers (fewer asks to the live helper)
        uses: actions/cache/restore@v4
        with:
          path: .helper-memo
          key: helper-memo-${{ github.workflow }}-${{ github.run_id }}
          restore-keys: helper-memo-${{ github.workflow }}-
      - name: Build the app (the repository's index.html is only a placeholder)
        run: sh build.sh && sh tools/test-helper.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download a trip, cut the internet, use every day
        run: npm i --no-save playwright@1.65.1 && npx playwright install --with-deps chromium && node tools/offline-e2e.cjs
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-check
          path: checks/offline-*.png
      - name: Stop the test stand-in (writes what it kept)
        if: always()
        run: sh tools/test-helper.sh stop
      - name: Keep the stand-in's answers for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .helper-memo
          key: helper-memo-${{ github.workflow }}-${{ github.run_id }}
