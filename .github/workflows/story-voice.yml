name: Story voice (record with free Kokoro)
# Records the story library in Kokoro (free, Apache 2.0) on GitHub's machines. Build time only: travelers' phones only
# play the saved recordings. No paid service, no Cloudflare AI.
on:
  workflow_dispatch:
    inputs:
      city: { description: "City folder under stories/", default: "athens" }
      voices: { description: "Kokoro voices, space separated", default: "af_heart" }
      story: { description: "One story id (blank = all)", default: "" }
  push:
    branches: [ "claude/**" ]
    paths: [ "stories/*/[a-z]*.json", "!stories/*/sources.json", "!stories/*/check-report.json", "stories/say.json", ".github/workflows/story-voice.yml" ]
permissions:
  contents: write
concurrency:
  group: story-voice-${{ github.ref }}
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: cd stories/tools && npm init -y >/dev/null && npm install --no-audit --no-fund kokoro-js@1.2.1 --onnxruntime-node-install-cuda=skip
      - name: Check stories first (nothing unchecked is recorded)
        run: node stories/tools/check-stories.mjs "${{ github.event.inputs.city || 'athens' }}"
      - name: Record
        run: |
          for v in ${{ github.event.inputs.voices || 'af_heart' }}; do node stories/tools/render-voice.mjs "${{ github.event.inputs.city || 'athens' }}" "$v" "${{ github.event.inputs.story }}"; done
      - run: |
          git config user.name "kairoute-bot"; git config user.email "actions@users.noreply.github.com"
          git add stories/*/audio
          git commit -m "Story voice: Kokoro recordings $(date -u +%F)" || exit 0
          git pull --rebase -q -X theirs && git push
