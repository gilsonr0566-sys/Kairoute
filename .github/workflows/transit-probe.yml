name: Transit probe
on:
  workflow_dispatch:
    inputs:
      pairs:
        description: "lat,lng>lat,lng;... (empty = the built-in examples)"
        default: ""
      date:
        description: "trip date YYYY-MM-DD for timetables (empty = the next weekday)"
        default: ""
      map_ms:
        description: "ms each map server is given (empty = 15000, as the helper)"
        default: ""
      trace:
        description: "1 = print every map and timetable request"
        default: ""
      ferry:
        description: "lat,lng>lat,lng for the ferry probe (empty = Naples terminal > Amalfi)"
        default: ""
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          PAIRS: ${{ inputs.pairs }}
          DATE: ${{ inputs.date }}
          TRACE: ${{ inputs.trace }}
          MAP_MS: ${{ inputs.map_ms }}
        run: node tools/transit-probe.mjs || true
      - env:
          FERRY: ${{ inputs.ferry }}
        run: node tools/ferry-probe.mjs || true
