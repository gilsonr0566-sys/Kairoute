name: Missing sights audit
# Every guide of the example trip against its sources' best-known places: missing, folded into another, or folded
# across more than 1 km. site: live = the published site, branch = this branch's build.
on:
  workflow_dispatch:
    inputs:
      site:
        description: "live or branch"
        default: live
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Serve this branch's build
        if: ${{ github.event.inputs.site == 'branch' }}
        run: |
          sh build.sh
          nohup python3 -m http.server 8080 >/dev/null 2>&1 &
          sleep 2 && curl -sf http://localhost:8080/ >/dev/null
          echo "URL=http://localhost:8080/" >> "$GITHUB_ENV"
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - run: node tools/missing-audit.cjs
