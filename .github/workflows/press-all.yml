name: Every button pressed
# Rule R-38 (Richard, Nov 27 2026: "Can we have Fable push all buttons"). A real touch on every control of every screen,
# on several trips (first open, the example cruise and train trip before and during the trip, a rail trip, a port day,
# a boat day, a group trip, odd and empty input), at phone and tablet size. See tools/client/press-all.cjs.
#   - on the LIVE Beta 2 site (the default when run by hand or on a schedule): real answers from the helper's free
#     lookups, each asked once a run; AI and paid paths refused; group trips never reach the live helper;
#   - or on the build of a branch (target: build), with no internet.
# Results: the full list of presses as an artifact, and the summary committed to the branch press-all-results.
on:
  workflow_dispatch:
    inputs:
      target: { description: "live or build", default: "live" }
      trips: { description: "trips (comma separated) or all", default: "all" }
  push:
    branches: ["claude/project-thread-4klenb"]
    paths: ["tools/client/press-run.json"]
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      trips: ${{ steps.q.outputs.trips }}
      target: ${{ steps.q.outputs.target }}
      run: ${{ steps.q.outputs.run }}
      sizes: ${{ steps.q.outputs.sizes }}
    steps:
      - uses: actions/checkout@v4
      - id: q
        env:
          IN_TARGET: ${{ github.event.inputs.target }}
          IN_TRIPS: ${{ github.event.inputs.trips }}
        run: |
          node -e "
          const fs=require('fs'); let q={}; try{q=JSON.parse(fs.readFileSync('tools/client/press-run.json','utf8'));}catch(e){}
          const all=['first','example','during','rail','port','ferry','group','odd'];
          const byHand=!!process.env.IN_TARGET;
          const target=(byHand?process.env.IN_TARGET:q.target)||'live';
          let trips=(byHand?process.env.IN_TRIPS:(q.trips||[]).join(','))||'all'; trips=trips==='all'?all:trips.split(',').filter(t=>all.includes(t));
          const sizes=(q.sizes&&!byHand?q.sizes:['phone','tablet']).filter(s=>['phone','tablet','upright'].includes(s));
          const run=String((byHand?'':q.run)||'run').replace(/[^A-Za-z0-9._-]/g,'-')+'-'+process.env.GITHUB_RUN_NUMBER;
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'trips='+JSON.stringify(trips)+'\ntarget='+(target==='build'?'build':'live')+'\nrun='+run+'\nsizes='+JSON.stringify(sizes)+'\n');"
  press:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        trip: ${{ fromJson(needs.plan.outputs.trips) }}
        size: ${{ fromJson(needs.plan.outputs.sizes) }}
    name: "${{ matrix.trip }} ${{ matrix.size }}"
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1.65.1 && npx playwright install --with-deps chromium
      - if: needs.plan.outputs.target == 'build'
        run: sh build-beta2.sh
      - name: Press every control
        env:
          TRIPS: ${{ matrix.trip }}
          SIZES: ${{ matrix.size }}
          OUT: press-out
        run: node tools/client/press-all.cjs ${{ needs.plan.outputs.target == 'build' && 'beta2-site/index.html' || 'https://gilsonr0566-sys.github.io/Kairoute-Beta2/' }} 2>&1 | tee press-out.log | grep -vE "^   [·↻.]" || true
      - if: always()
        run: mkdir -p press-out && cp press-out.log press-out/${{ matrix.trip }}-${{ matrix.size }}.log || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: press-${{ matrix.trip }}-${{ matrix.size }}
          path: press-out
          retention-days: 14
  report:
    needs: [plan, press]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { path: got, pattern: "press-*", merge-multiple: true }
      - run: sh build-beta2.sh
      - name: Report (every failure by class, the action names no press reached)
        id: rep
        env:
          NEED: ${{ join(fromJson(needs.plan.outputs.trips), ',') }}
        run: |
          mkdir -p got; node tools/client/press-report.cjs got beta2-site/index.html | tee got/report.log; echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          cat got/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: press-summary, path: "got/summary.*" }
      - name: Keep the summary on the results branch
        if: always()
        run: |
          set -e; D="press-all-results/${{ needs.plan.outputs.target }}-${{ needs.plan.outputs.run }}"
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/keep && cp got/summary.md got/summary.json got/report.log /tmp/keep/ 2>/dev/null || true
          for f in got/*.json; do case "$f" in *summary.json) ;; *) gzip -9 -c "$f" > "/tmp/keep/$(basename "$f").gz";; esac; done
          cp got/*.log /tmp/keep/ 2>/dev/null || true
          git fetch -q origin press-all-results 2>/dev/null && git checkout -q -B press-all-results FETCH_HEAD || git checkout -q --orphan press-all-results
          git rm -rq --cached . 2>/dev/null || true; git clean -fdxq -e got || true
          mkdir -p "$D" && cp /tmp/keep/* "$D/" && git add "$D" && git commit -qm "Every button pressed: ${{ needs.plan.outputs.target }} ${{ needs.plan.outputs.run }}"
          for i in 1 2 3 4; do git push -q origin HEAD:press-all-results && break; git pull -q --rebase origin press-all-results || true; sleep 5; done
      - name: Fail when a rule was broken or a control was not pressed
        if: steps.rep.outputs.code != '0'
        run: exit 1
