name: First-time traveler walk (live Beta 2)
# A clean browser uses the LIVE Beta 2 site as a brand-new traveler: enters a trip with real taps, then every page,
# reload and offline, at phone and tablet size. AI off, paid lookups refused: zero spend. Publishes nothing.
on:
  workflow_dispatch:
  push:
    branches: ["claude/project-thread-3d5hbw"]
    paths: ["tools/first-timer/trips.json"]
permissions:
  contents: read
concurrency:
  group: first-timer
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      trips: ${{ steps.q.outputs.trips }}
      run: ${{ steps.q.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: q
        run: |
          node -e "const q=require('./tools/first-timer/trips.json');const fs=require('fs');fs.appendFileSync(process.env.GITHUB_OUTPUT,'trips='+JSON.stringify(q.trips.map(t=>t.name))+'\nrun='+String(q.run).replace(/[^A-Za-z0-9._-]/g,'-')+'\n')"
  walk:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        trip: ${{ fromJson(needs.plan.outputs.trips) }}
        size: [phone, tablet]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - env:
          TRIP: ${{ matrix.trip }}
          SIZE: ${{ matrix.size }}
        run: node tools/first-timer/walk.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ft-${{ matrix.trip }}-${{ matrix.size }}
          path: ft-out
          retention-days: 14
  collect:
    needs: [plan, walk]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: _in
          pattern: ft-*
          merge-multiple: true
      - env:
          RUN: ${{ needs.plan.outputs.run }}
        run: |
          mkdir -p "first-timer-results/$RUN" && cp -r _in/* "first-timer-results/$RUN/" 2>/dev/null || true
          rm -rf _in
          git config user.name "first-timer" && git config user.email "first-timer@users.noreply.github.com"
          git add first-timer-results && git commit -q -m "First-time traveler results: $RUN" || echo "nothing new"
          git pull -q --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}"
