name: Booking probe
# Which booking pages open for a route, and the long-distance timetables Transitous knows (report only).
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-51n6it]
    paths: [tools/book-probe.mjs, .github/workflows/book-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/book-probe.mjs || true
