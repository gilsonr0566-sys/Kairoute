name: Rides live check
on:
  workflow_dispatch:
    inputs:
      ask:
        description: "lat,lng>lat,lng;... (empty = the Naples rides)"
        default: ""
      dow:
        description: "day of week 0-6"
        default: "3"
      date:
        description: "trip date YYYY-MM-DD"
        default: ""
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          ASK: ${{ inputs.ask }}
          DOW: ${{ inputs.dow }}
          DATE: ${{ inputs.date }}
        run: node tools/rides-live.mjs || true
