name: Sales video capture
# Screens of the live site and the Aurora narration for the Kairoute sales video. Runs on pushes to the video
# thread's branch only; saves the results on that branch (video-out/). Never publishes or changes the site.
on:
  push:
    branches: [claude/project-thread-qf9vva]
    paths: ["video/**", "tools/video-*", ".github/workflows/video-capture.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: video-capture
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Narration (Aurora)
        if: ${{ !contains(github.event.head_commit.message, '[no-voice]') }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node tools/video-voice.mjs
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - name: Screens (live site)
        if: ${{ !contains(github.event.head_commit.message, '[no-shots]') }}
        run: node tools/video-capture.cjs
      - name: Save on this branch
        run: |
          git add -f video-out
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git -c user.name="Kairoute video" -c user.email="actions@users.noreply.github.com" commit -m "Sales video: captured screens and narration"
          git pull --rebase origin claude/project-thread-qf9vva || true
          git push origin HEAD:claude/project-thread-qf9vva
