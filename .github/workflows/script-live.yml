name: Stop script live check
on:
  workflow_dispatch:
    inputs:
      stop:
        description: Stop script id
        default: prague-clock
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright@1.65.1 && npx playwright install --with-deps chromium && node tools/script-live.cjs "" "${{ inputs.stop }}"
