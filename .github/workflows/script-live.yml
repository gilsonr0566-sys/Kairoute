name: Stop script live check
on:
  workflow_dispatch:
    inputs:
      url:
        description: Site to check (Beta 2 only)
        default: https://gilsonr0566-sys.github.io/Kairoute-Beta2/
      stop:
        description: Stop script id
        default: prague-clock
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright@1.65.1 && npx playwright install --with-deps chromium && node tools/script-live.cjs "${{ inputs.url }}" "${{ inputs.stop }}"
