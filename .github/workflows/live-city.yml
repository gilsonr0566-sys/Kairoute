name: Test a new city on the live site
on:
  workflow_dispatch:
    inputs:
      city:
        description: City to build
        default: "Corpus Christi"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          CITY: ${{ inputs.city }}
        run: npm i playwright@1 && npx playwright install --with-deps chromium && node tools/live-city.cjs
