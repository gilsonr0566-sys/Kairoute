name: Test a new city on the live site
on:
  workflow_dispatch:
    inputs:
      city:
        description: City to build
        default: "Corpus Christi"
      interests:
        description: Interests, comma separated (e.g. churches,bible)
        default: ""
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          CITY: ${{ inputs.city }}
          INTERESTS: ${{ inputs.interests }}
        run: npm i playwright@1 && npx playwright install chromium && node tools/live-city.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-city
          path: live-city.json
          if-no-files-found: ignore
