name: Android app compiles
# Nov 21 review: the website's publish builds the Android app with continue-on-error, so a broken Android build
# never shows up (the live site quietly keeps an older app file). This check builds the same app and FAILS when it
# doesn't compile, so a broken wrapper is seen the day it breaks. No secrets, no signing, nothing published; the
# debug app file is kept as a run artifact for 7 days.
on:
  workflow_dispatch:
  push:
    paths: ["app/**", ".github/workflows/android-check.yml"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build the website and the Android app (debug)
        run: |
          sh build.sh
          cd app && npm ci && npm run sync
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace
      - name: The app file exists
        run: ls -la app/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kairoute-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
