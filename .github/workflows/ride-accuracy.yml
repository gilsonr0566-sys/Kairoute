name: Ride accuracy
# How close the helper's ride estimates (map: speed, waiting, walks) are to the published timetables, per ride kind,
# across the test trips (tools/ride-accuracy.mjs). Runs the live helper's code (main) and, when given, a candidate.
on:
  push:
    branches: ["claude/project-thread-xrdp7v"]
    paths: [".github/workflows/ride-accuracy.yml", "tools/ride-accuracy.mjs", "tools/ride-accuracy-run.txt"]
  workflow_dispatch:
  schedule:
    - cron: "5 * * * *"
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The saved test trips (the 20-city list and live trips)
        run: mkdir -p tools/beta2/snapshots && cp tools/beta2/corpus/*.json tools/beta2/snapshots/
      - name: The live helper's ride code (main)
        run: git fetch -q origin main && mkdir -p /tmp/live && git show origin/main:worker/transit.js > /tmp/live/transit.js
      # The full check (on a push or by hand) compares the live code and, when it differs, this branch's candidate in one
      # pass (the timetable is asked once). The hourly check is a quick sample of the live helper: one sight per day.
      - name: Measure
        run: |
          if [ "${{ github.event_name }}" = schedule ]; then
            node tools/ride-accuracy.mjs --transit /tmp/live/transit.js --max 1 --minutes 40 --out ride-accuracy-hourly.json | tee ride-accuracy-hourly.txt
          elif ! cmp -s worker/transit.js /tmp/live/transit.js && [ -f tools/ride-accuracy-candidate ]; then
            node tools/ride-accuracy.mjs --transit /tmp/live/transit.js,worker/transit.js --names live,candidate --minutes 150 --out ride-accuracy.json | tee ride-accuracy.txt
          else
            node tools/ride-accuracy.mjs --transit /tmp/live/transit.js --minutes 150 --out ride-accuracy-live.json | tee ride-accuracy-live.txt
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ride-accuracy
          path: ride-accuracy-*
