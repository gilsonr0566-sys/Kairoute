name: Printable plan live check
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["tools/print-live.cjs"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - run: node tools/print-live.cjs
