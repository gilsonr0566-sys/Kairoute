name: Publish website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build the Android app
        run: |
          sh build.sh
          cd app && npm ci && npm run sync
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Collect site files
        run: |
          mkdir _site && cp -r index.html version.txt .nojekyll manifest.webmanifest sw.js icons _site/
          cp app/android/app/build/outputs/apk/debug/app-debug.apk _site/Kairoute.apk
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
