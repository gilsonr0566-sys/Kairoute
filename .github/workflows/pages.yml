name: Publish website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: publish-site
  cancel-in-progress: false # finish each publish; a newer one waits its turn (cancelling could leave GitHub's placeholder live)
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY }}
      GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Check the code (stops a broken build from going live)
        run: sh tools/check.sh
      - name: Safety net (every screen agrees on every day of 6 sample trips; a failure stops the update going live)
        run: |
          sh build.sh
          npm i --no-save playwright@1 && npx playwright install --with-deps chromium
          node tools/plan-test.cjs
          node tools/ferry-unit.mjs
          node tools/safety-net.cjs
          node tools/nav-check.cjs
          node tools/pill-check.cjs
          node tools/menu-check.cjs
          node tools/layout-check.cjs
          node tools/ship-check.cjs
          node tools/voyage-check.cjs
          node tools/time-check.cjs
          node tools/ride-check.cjs
          node tools/anchor-e2e.cjs
          node tools/extras-check.cjs index.html checks/extras
          node tools/offline-e2e.cjs
      - name: Demo flow gate (Richard's Greece trip on this build, real internet; a failure stops the update going live)
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 1
          URL=http://localhost:8765/ PARTS=A GATE=1 node tools/demo-flow.cjs
          cat checks/demo/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Street map check (no network needed)
        run: MOCK=1 node tools/map-e2e.cjs
      - name: Speed check (phone and tablet, slowed like a mid-range phone; a slow app doesn't go live)
        run: node tools/perf-check.cjs . --json checks/speed.json
      - name: Keep the safety-net report even when it fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safety-net-report
          path: checks
      - name: Deploy the AI helper to Cloudflare (free Workers AI)
        continue-on-error: true
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "No CLOUDFLARE_API_TOKEN repository secret found; skipping the AI helper."; exit 0; fi
          echo "Cloudflare token found (${#CLOUDFLARE_API_TOKEN} characters)."
          cd worker && npx -y wrangler@4 deploy 2>&1 | tee deploy.log
          # Local events: the Ticketmaster key lives only in GitHub secrets and the Worker's secret store.
          if [ -n "$TICKETMASTER_KEY" ]; then printf '%s' "$TICKETMASTER_KEY" | npx -y wrangler@4 secret put TM_KEY >/dev/null && echo "Events key set."; else echo "No TICKETMASTER_KEY secret yet; events use Wikivoyage only."; fi
          # Restaurant ratings: the Google Places key lives only in GitHub secrets and the Worker's secret store.
          if [ -n "$GOOGLE_PLACES_KEY" ]; then printf '%s' "$GOOGLE_PLACES_KEY" | npx -y wrangler@4 secret put GPLACES_KEY >/dev/null && echo "Ratings key set."; else echo "No GOOGLE_PLACES_KEY secret yet; restaurants show as not yet rated."; fi
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -n "$url" ]; then printf '{"url":"%s"}\n' "$url" > ../ai.json; cat ../ai.json; fi
      - name: Build the Android app
        run: |
          sh build.sh
          cd app && npm ci && npm run sync
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Collect site files
        run: |
          mkdir _site && cp -r index.html usage.html version.txt .nojekyll manifest.webmanifest sw.js icons lib checks _site/
          cp app/android/app/build/outputs/apk/debug/app-debug.apk _site/Kairoute.apk
          if [ -f ai.json ]; then cp ai.json _site/; fi
      - name: Wait for GitHub's own branch copy to finish first
        # GitHub also publishes the repository as-is on every push (index.html there is only a placeholder).
        # That copy must never land after the real app, so wait until it is done before publishing.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            left=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=50" \
              | jq '[.workflow_runs[]? | select(.name == "pages build and deployment" and .status != "completed")] | length')
            [ "$left" = "0" ] && { echo "branch copy finished (or none)"; break; }
            echo "waiting for the branch copy ($left running)"; sleep 10
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 7 # kept so a failed publish can put this version back (job "restore")
      - id: deployment
        uses: actions/deploy-pages@v4
  restore:
    # A failed check keeps an update off the site, but GitHub's own branch copy has already published the
    # "Kairoute is updating" placeholder, which then stayed live until a later publish passed (Nov 14: 45 min).
    # Put the last good version back, so travelers always land on a working app.
    needs: deploy
    if: failure()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Find the last good publish
        id: last
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages.yml/runs?status=success&per_page=1" | jq -r '.workflow_runs[0].id // empty')
          [ -n "$id" ] || { echo "no earlier good publish found"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"; echo "Putting back the site from publish run $id"
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: ${{ steps.last.outputs.id }}
          github-token: ${{ github.token }}
          path: last
      - name: Wait for GitHub's own branch copy to finish first
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            left=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=50" \
              | jq '[.workflow_runs[]? | select(.name == "pages build and deployment" and .status != "completed")] | length')
            [ "$left" = "0" ] && break
            echo "waiting for the branch copy ($left running)"; sleep 10
          done
      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: last/artifact.tar
          retention-days: 7
      - uses: actions/deploy-pages@v4
