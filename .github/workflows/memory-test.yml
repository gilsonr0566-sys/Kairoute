name: Test ratings and memory video on the live site
on: workflow_dispatch
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Build the app (the repository's index.html is only a placeholder)
        run: sh build.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i playwright@1 && npx playwright install chromium && node tools/memory-test.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-test
          path: memory-test/
          if-no-files-found: ignore
