name: Add a place live check
# "Don't see a place you want?" on the live site with the real AI: real names typed on an Athens day, phone and tablet.
on:
  workflow_dispatch:
    inputs:
      site:
        description: "live = the published site, branch = this branch's build before publishing"
        default: "live"
      names:
        description: "Places to type, separated by |"
        default: "Roman Agora|Corinth Canal|Hadrian's Library"
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Serve this branch's build instead of the live site
        if: ${{ github.event.inputs.site == 'branch' }}
        run: |
          sh build.sh
          nohup python3 -m http.server 8080 >/dev/null 2>&1 &
          sleep 2 && curl -sf http://localhost:8080/ >/dev/null
          echo "URL=http://localhost:8080/" >> "$GITHUB_ENV"
      - env:
          NAMES: ${{ inputs.names }}
        run: npm i playwright@1 && npx playwright install chromium && node tools/addplace-live.cjs
