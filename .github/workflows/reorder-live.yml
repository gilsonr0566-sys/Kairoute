name: Day plan live check
# Drag to reorder the day's stops on the published site (phone and tablet): handles, touch drag, arrow keys, the
# "Put back / Keep new order" question, the ship margin and a day marked ready; and picking the day's hours from the
# time tile (hours-check). On demand, after a publish.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i playwright@1 && npx playwright install chromium && node tools/reorder-check.cjs https://gilsonr0566-sys.github.io/Kairoute/
      - if: always()
        run: node tools/hours-check.cjs https://gilsonr0566-sys.github.io/Kairoute/
