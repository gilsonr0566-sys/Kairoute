name: Story sources (fetch research copies)
# Research input for the story library: fetches the sources listed in stories/<city>/sources.json and commits dated
# text copies. No AI, no paid service.
on:
  push:
    branches: [ "claude/**" ]
    paths: [ "stories/*/sources.json" ]
  workflow_dispatch:
    inputs:
      city: { description: "City folder under stories/ (blank = every city; sources already saved are kept)", default: "" }
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          C="${{ github.event.inputs.city }}"
          if [ -n "$C" ]; then node stories/tools/fetch-sources.mjs "$C"; else
            for f in stories/*/sources.json; do node stories/tools/fetch-sources.mjs "$(basename "$(dirname "$f")")"; done; fi
      - run: |
          git config user.name "kairoute-bot"; git config user.email "actions@users.noreply.github.com"
          git add stories/*/snapshots
          git commit -m "Story sources: research copies fetched $(date -u +%F)" || exit 0
          git pull --rebase -q && git push
