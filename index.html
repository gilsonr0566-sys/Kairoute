<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<meta name="theme-color" content="#123C3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kairoute">
<title>Kairoute</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Outfit:wght@500;700;800&display=swap">
<style>
/* Layout: one mobile-first column like a pocket guidebook; a transit-map route diagram is the signature element. */
:root {
  --paper: #F3F5F1;
  --card: #FFFFFF;
  --ink: #123C3A;
  --muted: #56636C;
  --line: #D8DED8;
  --route: #146B61;
  --route-soft: #DCEEEA;
  --ride: #7B3FE4;
  --meal: #D9532A;
  --meal-soft: #FCE8DF;
  --must: #A8325C;
  --must-soft: #F6E1E8;
  --warn: #9A3B12;
  --font-display: "Outfit", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1418; --card: #161F25; --ink: #E6ECE9; --muted: #9AA8AF; --line: #2A363D;
    --route: #4CC2B0; --route-soft: #143A36; --ride: #C3A0FF; --meal: #F58A62; --meal-soft: #3D2219;
    --must: #EB7EA4; --must-soft: #3E1C29; --warn: #F08A5D; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E1418; --card: #161F25; --ink: #E6ECE9; --muted: #9AA8AF; --line: #2A363D;
  --route: #4CC2B0; --route-soft: #143A36; --ride: #C3A0FF; --meal: #F58A62; --meal-soft: #3D2219;
  --must: #EB7EA4; --must-soft: #3E1C29; --warn: #F08A5D; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h2 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.01em; }
h3 { font-size: 1.1rem; font-weight: 700; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--route); outline-offset: 2px; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); }
.top .wrap { padding-block: 12px 0; display: grid; gap: 10px; }
.brand { display: flex; align-items: baseline; gap: 10px; justify-content: space-between; }
.brand h1 { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.02em; }
.brand h1 span { color: var(--route); }
.brand small { color: var(--muted); font-size: 0.8rem; }
.dayrow { display: flex; gap: 6px; align-items: center; min-width: 0; }
.days { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: thin; padding-bottom: 4px; flex: 1; min-width: 0; scroll-behavior: smooth; }
.dayarrow { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-weight: 800; color: var(--ink); }
.daycount { flex: none; font-size: 0.8rem; color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
.daychip { flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 12px; font-size: 0.85rem; cursor: pointer; }
.daychip b { font-family: var(--font-display); }
.daychip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 4px 9px; font-weight: 700; font-size: 0.92rem; color: var(--muted); cursor: pointer; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--route); }

main .wrap { padding-block: 20px 64px; display: grid; gap: 18px; }
.lede { color: var(--muted); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 14px; min-width: 0; }
.banner { background: var(--route-soft); border-radius: var(--r); padding: 12px 14px; font-size: 0.92rem; display: flex; gap: 10px; align-items: flex-start; }
.banner.warn { background: var(--meal-soft); }
.eyebrow { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }

.field { display: grid; gap: 6px; min-width: 0; }
.field label, .field .lbl { font-weight: 700; font-size: 0.9rem; }
.field .hint { color: var(--muted); font-size: 0.82rem; }
input[type=text], input[type=date], input[type=time], input[type=number], select, textarea {
  width: 100%; border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 10px 12px; min-height: 44px;
}
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 460px) { .row2 { grid-template-columns: 1fr; } }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 8px 12px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; min-height: 42px; }
.seg button[aria-pressed="true"] { background: var(--route); color: var(--card); border-color: var(--route); font-weight: 700; }
.seg.pace { margin-top: 8px; }
.seg.pace button { padding: 6px 10px; min-height: 38px; font-size: 14px; }
.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.check input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--route); flex: none; }

.btn { border: 0; border-radius: 12px; padding: 12px 18px; font-weight: 700; cursor: pointer; background: var(--route); color: var(--card); min-height: 46px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.small { padding: 8px 12px; min-height: 38px; font-size: 0.9rem; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }

.daycard { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); }
.daycard.active { border-color: var(--route); box-shadow: inset 4px 0 0 var(--route); }
.daycard .meta { color: var(--muted); font-size: 0.85rem; }
.daylist { display: grid; gap: 8px; }

/* Sites */
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.sitelist { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); }
.site { display: grid; grid-template-columns: auto 1fr; gap: 12px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); cursor: pointer; }
.site.on { border-color: var(--route); background: color-mix(in srgb, var(--route-soft) 55%, var(--card)); }
.site input { width: 22px; height: 22px; accent-color: var(--route); margin-top: 2px; }
.site .body { display: grid; gap: 4px; min-width: 0; }
.site .name { font-weight: 700; font-family: var(--font-display); font-size: 1.05rem; }
.site .sum { color: var(--muted); font-size: 0.92rem; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: 0.74rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); color: var(--muted); letter-spacing: 0.02em; }
.tag.must { background: var(--must-soft); color: var(--must); border-color: transparent; }
.tag.local { background: var(--route-soft); color: var(--route); border-color: transparent; }
.tag.fit { background: var(--route-soft); color: var(--route); border-color: transparent; }
.tag.nofit { background: var(--meal-soft); color: var(--warn); border-color: transparent; }
.travelnote { font-size: 0.85rem; color: var(--muted); }
.stickybar { position: sticky; bottom: 0; padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--paper) 70%, transparent); display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.stickybar .count { font-weight: 700; }

/* Plan */
.summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
@media (max-width: 460px) { .summary { grid-template-columns: repeat(2, 1fr); } }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.stat b { display: block; font-family: var(--font-display); font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 0.8rem; }
.mapbox { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.mapbox svg { display: block; width: 100%; height: auto; }
.maplegend { display: flex; gap: 14px; flex-wrap: wrap; padding: 10px 14px; border-top: 1px solid var(--line); font-size: 0.82rem; color: var(--muted); }
.maplegend i { display: inline-block; width: 18px; height: 0; border-top: 3px solid var(--route); vertical-align: middle; margin-right: 6px; }
.maplegend i.dash { border-top-style: dashed; border-top-color: var(--ride); }
.timeline { display: grid; }
.tl { display: grid; grid-template-columns: 58px 30px 1fr; column-gap: 8px; }
.tl .time { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 0.9rem; padding-top: 12px; text-align: right; }
.tl .rail { position: relative; display: flex; justify-content: center; }
.tl .rail::before { content: ""; position: absolute; top: 0; bottom: 0; width: 4px; background: linear-gradient(var(--rin, var(--route)) 0 50%, var(--rout, var(--route)) 50% 100%); left: 13px; }
.tl.rin { --rin: var(--ride); } .tl.rout { --rout: var(--ride); }
.tl.first .rail::before { top: 18px; }
.tl.last .rail::before { bottom: calc(100% - 22px); }
.tl.leg .rail::before { background: repeating-linear-gradient(var(--ride) 0 7px, transparent 7px 12px); width: 4px; left: 13px; }
.tl.leg.walk .rail::before { background: var(--route); width: 4px; left: 13px; }
.tl.leg .what { display: flex; align-items: center; gap: 8px; }
.tl.leg.ride .what { color: var(--ride); }
.tl.leg.walk .what { color: var(--route); }
.tl.leg .what b { font-weight: 700; }
.legico { width: 20px; height: 20px; flex: none; }
.tourleg { display: flex; align-items: center; gap: 8px; }
.tourleg.ride { color: var(--ride); }
.tourleg .legico { width: 26px; height: 26px; }
.dot { position: relative; z-index: 1; margin-top: 10px; width: 26px; height: 26px; border-radius: 50%; background: var(--card); border: 3px solid var(--route); display: grid; place-items: center; font-size: 0.75rem; font-weight: 800; font-family: var(--font-display); }
.dot.start { border-radius: 6px; background: var(--ink); border-color: var(--ink); color: var(--paper); }
.dot.meal { border-color: var(--meal); color: var(--meal); }
.dot.quick { width: 18px; height: 18px; margin-top: 14px; border-width: 3px; background: var(--route); }
.tl .what { padding: 9px 0 12px; min-width: 0; }
.tl .what .nm { font-weight: 700; }
.tl .what .sub { color: var(--muted); font-size: 0.88rem; }
.tl .what .sub.bonus { color: var(--route); font-weight: 600; }
.tl.leg .what { padding: 2px 0 4px; color: var(--muted); font-size: 0.85rem; }
.tl .what button.link { background: none; border: 0; padding: 0; color: var(--route); font-weight: 700; cursor: pointer; text-align: left; }
.mealbox { background: var(--meal-soft); border-radius: 10px; padding: 10px 12px; margin-top: 6px; display: grid; gap: 4px; }
.mealbox .alt { font-size: 0.85rem; color: var(--muted); }
.tl.evening { border-top: 1px dashed var(--line); margin-top: 6px; padding-top: 10px; }
.tl.evening .rail::before, .tl.evening .rail::after { display: none; }
.bookrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 12px 0 0; font-size: 0.9rem; color: var(--muted); }
.bookform { margin-top: 14px; }
.bookform .row2 { display: grid; grid-template-columns: 1fr 140px; gap: 10px; }
.bookform label { display: grid; gap: 4px; font-weight: 600; font-size: 0.9rem; }
.bookform input { font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); }
.bookres { display: grid; gap: 8px; }
.bookres .btn { display: grid; justify-items: start; text-align: left; gap: 2px; }
.bookres small { color: var(--muted); font-weight: 400; }
@media (max-width: 640px) { .bookform .row2 { grid-template-columns: 1fr; } }
.dropped { font-size: 0.9rem; }

/* Guide */
.stoplist { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); align-items: start; }
.stopcard { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.postcard { position: relative; aspect-ratio: 16 / 7; max-width: 100%; display: block; }
.postcard svg { width: 100%; height: 100%; display: block; }
.postcard .num { position: absolute; left: 14px; top: 12px; width: 38px; height: 38px; border-radius: 50%; background: var(--card); color: var(--ink); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; }
.postcard .cat { position: absolute; right: 14px; top: 16px; background: color-mix(in srgb, var(--card) 85%, transparent); padding: 3px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 700; }
.stopbody { padding: 16px; display: grid; gap: 14px; min-width: 0; }
.stopbody .head { display: grid; gap: 4px; }
.lookfor { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; counter-reset: lf; }
.lookfor li { counter-increment: lf; display: grid; grid-template-columns: 26px 1fr; gap: 8px; }
.lookfor li::before { content: counter(lf); width: 24px; height: 24px; border-radius: 50%; background: var(--must-soft); color: var(--must); font-weight: 800; font-size: 0.8rem; display: grid; place-items: center; }
.guidetext { max-width: 65ch; display: grid; gap: 10px; }
.guidetext p { font-size: 1.02rem; }
.audio { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.audio .state { color: var(--muted); font-size: 0.85rem; }
.ask { display: flex; gap: 8px; }
.ask input { flex: 1; min-width: 0; }
.answer { background: var(--paper); border-radius: 10px; padding: 12px; white-space: pre-wrap; font-size: 0.95rem; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.askbox { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.ask input { flex: 1; min-width: 0; }
.mic.on { background: var(--meal); color: #fff; animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .6; } }
.banner.quiet { background: var(--route-soft); }
.phototip { font-size: 0.9rem; color: var(--muted); }
details.more summary { cursor: pointer; font-weight: 700; color: var(--route); }
.empty { text-align: center; padding: 36px 16px; color: var(--muted); display: grid; gap: 12px; justify-items: center; }
.spinner { width: 18px; height: 18px; border: 3px solid var(--route-soft); border-top-color: var(--route); border-radius: 50%; animation: spin 0.9s linear infinite; display: inline-block; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
.ai-note { font-size: 0.85rem; color: var(--muted); }
/* Tablet-first layouts */
.plangrid, .tripgrid { display: grid; gap: 18px; min-width: 0; }
.plangrid > *, .tripgrid > * { display: grid; gap: 16px; align-content: start; min-width: 0; }
@media (min-width: 800px) {
  .plangrid { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); }
  .plangrid .left { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 140px); }
  .tripgrid { grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); }
  body { font-size: 17px; }
  .tab { font-size: 1rem; padding-block: 12px 11px; }
}
.footnote { font-size: 0.8rem; color: var(--muted); }
.itin { display: grid; gap: 4px; max-height: none; }
.itrow { display: grid; grid-template-columns: 52px 30px 1fr; gap: 8px; align-items: center; padding: 5px 8px; border-radius: 10px; border: 1px solid transparent; background: none; text-align: left; cursor: pointer; width: 100%; }
.itrow:hover { background: var(--card); }
.itrow.active { background: var(--card); border-color: var(--route); box-shadow: inset 4px 0 0 var(--route); }
.itrow .dt { font-variant-numeric: tabular-nums; font-size: 0.82rem; color: var(--muted); font-weight: 700; line-height: 1.2; }
.itrow .ic { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; background: var(--route-soft); color: var(--route); font-size: 1rem; }
.itrow .ic.port, .itrow .ic.embark, .itrow .ic.sea { background: var(--meal-soft); color: var(--meal); }
.itrow .ic.arrival, .itrow .ic.departure { background: var(--must-soft); color: var(--must); }
.itrow .tx { min-width: 0; }
.itrow .tx b { display: block; font-family: var(--font-display); }
.itrow .tx span { color: var(--muted); font-size: 0.82rem; }
.itrow .ok { font-size: 0.72rem; font-weight: 700; color: var(--route); }
.legsep { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 10px 10px 2px; }
.leftcol { display: grid; gap: 12px; align-content: start; }

.seacard { text-align: center; padding: 40px 16px; display: grid; gap: 10px; justify-items: center; }
.seacard .big { font-size: 2.6rem; }
.windowbar { display: flex; flex-wrap: wrap; gap: 8px; }
.windowbar span { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 0.85rem; }
textarea { min-height: 140px; resize: vertical; line-height: 1.45; }
.dot.fixed { border-radius: 6px; border-color: var(--must); color: var(--must); }
.tripname { font-weight: 700; color: var(--muted); font-size: 0.85rem; margin-top: -6px; }
.basics { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 10px 16px; }
.basics div, .before div { display: grid; gap: 2px; font-size: 0.92rem; }
.basics b, .before b { font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.before { display: grid; gap: 8px; background: var(--paper); border-radius: 10px; padding: 12px; }
.phrases { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 8px; }
.phrase { display: grid; grid-template-columns: 1fr auto; text-align: left; gap: 0 8px; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.phrase .pl { font-weight: 700; font-family: var(--font-display); font-size: 1.05rem; }
.phrase .ps { grid-column: 1; color: var(--route); font-size: 0.85rem; font-style: italic; }
.phrase .pm { grid-column: 1; color: var(--muted); font-size: 0.85rem; }
.phrase .pp { grid-column: 2; grid-row: 1 / span 3; align-self: center; color: var(--route); }
.countdown { border-color: var(--meal); }
.cdrow { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; }
.cdbig { font-family: var(--font-display); font-weight: 800; font-size: 2.6rem; line-height: 1; font-variant-numeric: tabular-nums; color: var(--meal); }
.cdsub { color: var(--muted); font-size: 0.9rem; max-width: 46ch; margin-top: 6px; }
.journal { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.stars { display: flex; gap: 2px; color: var(--meal); font-size: 1.5rem; }
.star { background: none; border: 0; font-size: 1.7rem; line-height: 1; color: var(--line); cursor: pointer; padding: 2px 4px; min-width: 40px; min-height: 40px; }
.star.on { color: var(--meal); }
.photos { display: flex; flex-wrap: wrap; gap: 8px; }
.ph { position: relative; width: 96px; height: 96px; border-radius: 10px; overflow: hidden; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph button { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 50%; border: 0; background: var(--card); color: var(--ink); cursor: pointer; }
.addph { width: 96px; height: 96px; border: 2px dashed var(--line); border-radius: 10px; display: grid; place-items: center; text-align: center; font-size: 0.85rem; font-weight: 700; color: var(--route); cursor: pointer; }
@media (max-width: 460px) { .tab { font-size: 0.8rem; padding-inline: 2px; } }
.tips { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.tips li { padding-left: 14px; border-left: 3px solid var(--route-soft); }
[hidden] { display: none !important; }
.hint { color: var(--muted); font-size: 0.82rem; }
.logo { display: flex; align-items: center; gap: 8px; font-weight: 700 !important; letter-spacing: -0.03em !important; font-size: 1.55rem !important; }
.tourhead { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.tourhead > div { flex: 1; min-width: 0; display: grid; gap: 6px; }
.tourbar { height: 8px; border-radius: 99px; background: var(--route-soft); overflow: hidden; }
.tourbar i { display: block; height: 100%; background: var(--meal); border-radius: 99px; }
.tourship { justify-content: space-between; flex-wrap: wrap; }
.tourcard { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px; display: grid; gap: 16px; max-width: 760px; width: 100%; margin: 0 auto; }
.tourtitle { font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: 800; letter-spacing: -0.02em; }
.tourleg { font-size: 1.2rem; font-weight: 700; color: var(--route); }
.tourmain { justify-content: flex-end; }
.bigbtn { font-size: 1.15rem; padding: 16px 26px; min-height: 58px; border-radius: 14px; }
.bigplay { font-size: 1.1rem; padding: 14px 22px; min-height: 54px; }
.tourlist { margin: 0; padding-left: 22px; display: grid; gap: 4px; font-variant-numeric: tabular-nums; }
.timeleft { font-weight: 700; color: var(--route); }
.timeleft.soon { color: var(--meal); }
.finds { display: grid; gap: 8px; }
.find { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: center; text-align: left; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); cursor: pointer; min-height: 56px; }
.find .fk { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--must-soft); color: var(--must); font-weight: 800; }
.find.on { border-color: var(--route); background: var(--route-soft); }
.find.on .fk { background: var(--route); color: var(--card); }
.picks { border: 1px solid var(--line); border-left: 4px solid var(--meal); border-radius: 12px; padding: 14px; background: var(--card); display: grid; gap: 10px; }
.pickhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pickhead .lede { font-size: .85rem; }
.picks .badge { background: var(--ink); color: var(--paper); font-size: .68rem; font-weight: 800; letter-spacing: .08em; border-radius: 6px; padding: 2px 6px; }
.picks ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.picks li { display: grid; grid-template-columns: 32px 1fr; gap: 10px; align-items: start; }
.picks .pic { width: 32px; height: 32px; border-radius: 10px; background: var(--meal-soft); color: var(--meal); display: grid; place-items: center; }
.picks .pic svg { width: 18px; height: 18px; }
.picks .pk { display: block; font-size: .72rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--meal); }
.follow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
.follow .lede { font-size: .88rem; flex: 1; min-width: 12em; }
/* ---------- Lobby, settings, legal, brand film ---------- */
#view.full { max-width: none; padding: 0; }
main:has(#view.full) { padding: 0; }
.k-mark { display: block; overflow: visible; }
.k-mark .k-stem, .k-mark .k-leg { fill: var(--k-ink, #123C3A); stroke: var(--k-ink, #123C3A); }
.k-mark .k-leg { fill: none; }
.k-mark .k-dot { fill: #F0643A; }
.k-mark .k-ring { fill: none; stroke: #F0643A; }
.k-anim .k-stem { transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(0); animation: kStem .7s cubic-bezier(.2,.8,.2,1) .15s forwards; }
.k-anim .k-leg { stroke-dasharray: 1; stroke-dashoffset: 1; animation: kDraw .6s ease-out .7s forwards; }
.k-anim .k-dot { transform-box: fill-box; transform-origin: center; transform: scale(0); animation: kPop .35s cubic-bezier(.3,1.6,.5,1) forwards; }
.k-anim .k-dot:nth-of-type(1) { animation-delay: 1.15s; } .k-anim .k-dot:nth-of-type(2) { animation-delay: 1.3s; }
.k-anim .k-dot:nth-of-type(3) { animation-delay: 1.45s; } .k-anim .k-dot:nth-of-type(4) { animation-delay: 1.6s; }
.k-anim .k-ring { stroke-dasharray: 1; stroke-dashoffset: 1; animation: kDraw .5s ease-out 1.8s forwards; }
@keyframes kStem { to { transform: scaleY(1); } }
@keyframes kDraw { to { stroke-dashoffset: 0; } }
@keyframes kPop { to { transform: scale(1); } }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.lobby { min-height: 100vh; display: flex; flex-direction: column; background: var(--paper); }
.hero { position: relative; overflow: hidden; background: radial-gradient(120% 90% at 50% 0%, #1B5450 0%, #123C3A 55%, #0C2B29 100%); color: #F7F5F0; padding: max(28px, env(safe-area-inset-top, 0px)) 16px 56px; }
.hero .bg { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .22; pointer-events: none; }
.hero .bg path { fill: none; stroke: #F7F5F0; stroke-width: 1.4; stroke-dasharray: 2 9; stroke-linecap: round; }
.hero .bg circle { fill: #F0643A; }
.herobar { position: relative; max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.herobar .pill { font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: #F7F5F0; opacity: .75; }
.iconbtn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid rgba(247,245,240,.3); background: rgba(247,245,240,.06); color: #F7F5F0; border-radius: 999px; padding: 8px 14px; min-height: 42px; font-weight: 700; cursor: pointer; }
.iconbtn:hover { background: rgba(247,245,240,.14); }
.iconbtn svg { width: 18px; height: 18px; }
.herocore { position: relative; max-width: 760px; margin: 0 auto; text-align: center; display: grid; justify-items: center; gap: 14px; padding-top: clamp(28px, 7vh, 80px); }
.herocore .k-mark { --k-ink: #F7F5F0; width: clamp(84px, 13vw, 128px); height: auto; }
.wordmark { font-family: var(--font-display); font-weight: 800; letter-spacing: -0.035em; font-size: clamp(2.6rem, 7vw, 4.2rem); line-height: 1; opacity: 0; animation: rise .6s ease-out 1.9s forwards; }
.tagline { font-family: var(--font-display); font-weight: 500; font-size: clamp(1.25rem, 3vw, 1.75rem); letter-spacing: -0.01em; opacity: 0; animation: rise .6s ease-out 2.3s forwards; }
.tagline b { color: #F0643A; font-weight: 700; }
.herosub { max-width: 34em; color: rgba(247,245,240,.78); opacity: 0; animation: rise .6s ease-out 2.6s forwards; }
.heroacts { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 10px; opacity: 0; animation: rise .6s ease-out 2.9s forwards; }
.btn.sun { background: #F0643A; color: #fff; font-size: 1.05rem; padding: 14px 24px; min-height: 52px; box-shadow: 0 8px 24px rgba(240,100,58,.35); }
.btn.sun:hover { background: #E2552C; }
.btn.light { background: transparent; color: #F7F5F0; border: 1px solid rgba(247,245,240,.4); font-size: 1.05rem; padding: 14px 22px; min-height: 52px; }
.btn.light:hover { background: rgba(247,245,240,.1); }
.lobbybody { width: 100%; max-width: 1100px; margin: -32px auto 0; padding: 0 16px 32px; display: grid; gap: 22px; position: relative; flex: 1; align-content: start; }
.resume { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 20px; display: grid; grid-template-columns: auto 1fr auto; gap: 18px; align-items: center; box-shadow: 0 12px 32px rgba(18,60,58,.12); }
.resume .stamp { width: 64px; height: 64px; border-radius: 16px; background: var(--route-soft); color: var(--route); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; line-height: 1; text-align: center; font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; }
.resume .stamp b { display: block; font-size: 1.5rem; letter-spacing: -0.02em; }
.resume h3 { font-size: 1.3rem; }
.resume .meta { color: var(--muted); font-size: .92rem; }
@media (max-width: 520px) { #aiStatus { display: none; } }
.tag.seen { background: var(--route-soft); color: var(--route); font-weight: 700; }
.addplace .addrow { display: flex; gap: 8px; }
.addplace .addrow input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 10px 12px; min-height: 46px; }
.card.suggest { display: grid; gap: 10px; border-color: var(--route); }
.card.suggest h3 { margin: 0 0 4px; }
.renamebox { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 4px 0; }
.renamebox input { flex: 1; min-width: 12em; border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 8px 12px; min-height: 42px; font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; }
.change textarea { width: 100%; border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 10px 12px; min-height: 64px; resize: vertical; }
.change .chips { display: flex; flex-wrap: wrap; gap: 8px; }
.change .chip { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: .88rem; min-height: 36px; }
.change .chip:hover { border-color: var(--route); color: var(--route); }
.change .thumb { width: 54px; height: 54px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
.meter { position: sticky; top: var(--hdr, 150px); z-index: 3; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 6px; box-shadow: 0 6px 18px rgba(18,60,58,.08); }
.meter .mrow { display: flex; justify-content: space-between; gap: 10px; font-size: .95rem; }
.meter .mrow span { color: var(--muted); font-size: .85rem; }
.meter .mbar { height: 10px; border-radius: 999px; background: var(--route-soft); overflow: hidden; }
.meter .mbar i { display: block; height: 100%; background: var(--route); border-radius: 999px; transition: width .3s; }
.meter p { font-size: .88rem; color: var(--muted); }
.meter.near .mbar i { background: #D99A2B; }
.meter.full { border-color: var(--meal); }
.meter.full .mbar i { background: var(--meal); }
.meter.full p { color: var(--ink); }
.resacts { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 12px; }
.resacts .lede { margin-right: auto; font-size: .85rem; }
.sechead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.sechead h2 { font-size: 1.25rem; }
.tripcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.tripcard { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; display: grid; }
.tripcard .band { height: 74px; background: linear-gradient(135deg, #123C3A, #146B61); position: relative; overflow: hidden; }
.tripcard .band svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.tripcard .band path { fill: none; stroke: #F7F5F0; stroke-opacity: .55; stroke-width: 2; stroke-dasharray: 2 7; stroke-linecap: round; }
.tripcard .band circle { fill: #F0643A; }
.tripcard .in { padding: 14px 16px 16px; display: grid; gap: 10px; }
.tripcard h3 { font-size: 1.05rem; }
.tripcard .meta { color: var(--muted); font-size: .85rem; }
.tripcard .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.moremenu { position: relative; }
.moremenu > summary { list-style: none; cursor: pointer; font-weight: 700; font-size: .9rem; padding: 8px 14px; border: 1px solid var(--line); border-radius: 10px; color: var(--ink); background: var(--card); min-height: 40px; display: inline-flex; align-items: center; }
.moremenu > summary::-webkit-details-marker { display: none; }
.moremenu > summary::after { content: "▾"; margin-left: 6px; color: var(--muted); }
.moremenu[open] > summary::after { content: "▴"; }
.moremenu .mm { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
/* Day plan: one glance strip, one main action, small tools */
.daysum { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.daysum > div { padding: 10px 12px; border-left: 1px solid var(--line); min-width: 0; }
.daysum > div:first-child { border-left: 0; }
.daysum b { display: block; font-family: var(--font-display); font-size: 1.15rem; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.daysum span { display: block; color: var(--muted); font-size: 0.78rem; line-height: 1.25; }
@media (max-width: 520px) { .daysum { grid-template-columns: repeat(2, minmax(0, 1fr)); } .daysum > div:nth-child(3) { border-left: 0; } .daysum > div:nth-child(n+3) { border-top: 1px solid var(--line); } }
.lede.small { font-size: 0.88rem; margin: 0; }
.planacts { display: grid; gap: 10px; margin: 2px 0; }
.planacts .bigbtn { width: 100%; background: var(--meal); }
.toolrow { display: flex; flex-wrap: wrap; gap: 8px; }
.toolrow .btn { flex: 1 1 auto; }
.btn.toggle { gap: 8px; cursor: pointer; }
.btn.toggle input { width: 18px; height: 18px; margin: 0; accent-color: var(--route); }
.btn.toggle:has(input:checked) { background: var(--route-soft); border-color: var(--route); color: var(--route); }
@media (min-width: 900px) { .planacts { grid-template-columns: minmax(260px, 1fr) auto; align-items: center; } .toolrow .btn { flex: 0 0 auto; } }
.badges { display: flex; flex-wrap: wrap; gap: 6px; }
.badge { font-style: normal; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.02em; text-transform: uppercase; color: var(--meal); background: var(--card); border-radius: 999px; padding: 2px 8px; }
.badge.kpick { background: linear-gradient(135deg, #f2b33d, var(--meal)); color: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.18); }
.crowd { font-size: .85rem; font-weight: 700; color: var(--ink); }
.raterow { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-top: 6px; font-size: .88rem; font-weight: 600; }
.stars.small .star { font-size: 1.35rem; min-width: 36px; min-height: 36px; padding: 0 2px; }
.memcard .actions { margin-top: 10px; }
.memprog { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; margin-top: 10px; }
.memprog i { display: block; height: 100%; background: var(--meal); width: 0; transition: width .3s; }
.memvideo { width: 100%; max-height: 70vh; border-radius: 14px; background: #000; margin-top: 10px; }
/* On phones the timeline is the main content: show it before the map */
@media (max-width: 799px) { .plangrid .right { order: -1; } }
details.goodtoknow { display: grid; gap: 14px; }
details.goodtoknow[open] > summary { margin-bottom: 12px; }
details.goodtoknow > .card { margin-top: 12px; }
details.dayopts { border-top: 1px solid var(--line); padding-top: 12px; }
details.dayopts[open] > summary { margin-bottom: 10px; }
details.dayopts .field, details.dayopts .check { margin-top: 10px; }
.newcard { border: 2px dashed var(--line); border-radius: 16px; background: transparent; display: grid; place-items: center; gap: 6px; padding: 24px; cursor: pointer; color: var(--route); font-weight: 700; min-height: 180px; }
.newcard:hover { border-color: var(--route); background: var(--route-soft); }
.newcard .plus { width: 44px; height: 44px; border-radius: 50%; background: var(--route); color: var(--card); display: grid; place-items: center; font-size: 1.6rem; line-height: 1; }
.pillars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.pillar { padding: 16px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); display: grid; gap: 6px; align-content: start; }
.pillar .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--meal-soft); color: var(--meal); }
.pillar .ic svg { width: 22px; height: 22px; }
.pillar h3 { font-size: 1rem; }
.pillar p { color: var(--muted); font-size: .9rem; }
.lobbyfoot { border-top: 1px solid var(--line); padding: 18px 16px max(22px, env(safe-area-inset-bottom, 0px)); }
.lobbyfoot .in { max-width: 1100px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; justify-content: space-between; }
.lobbyfoot nav { display: flex; flex-wrap: wrap; gap: 4px 18px; }
.linkbtn { background: none; border: 0; padding: 6px 0; color: var(--ink); font-weight: 700; cursor: pointer; min-height: 36px; }
.linkbtn:hover { color: var(--route); text-decoration: underline; }
.lobbyfoot small { color: var(--muted); }
@media (max-width: 640px) {
  .resume { grid-template-columns: auto 1fr; }
  .resume .go { grid-column: 1 / -1; }
  .resume .go .btn { width: 100%; }
  .pillars { grid-template-columns: 1fr; }
  .heroacts .btn { width: 100%; }
}

/* Inner pages (settings, privacy, terms) */
.page { max-width: 760px; margin: 0 auto; padding: max(14px, env(safe-area-inset-top, 0px)) 16px 40px; display: grid; gap: 18px; }
.pagebar { display: flex; align-items: center; gap: 12px; justify-content: space-between; padding: 6px 0 10px; border-bottom: 1px solid var(--line); }
.pagebar .home { display: inline-flex; align-items: center; gap: 8px; background: none; border: 0; cursor: pointer; font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; letter-spacing: -0.02em; color: var(--ink); padding: 6px 0; }
.pagebar .home .k-mark { width: 24px; height: auto; --k-ink: var(--ink); }
.legal { display: grid; gap: 14px; }
.legal h3 { margin-top: 8px; }
.legal p, .legal li { color: var(--ink); }
.legal ul { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.draftnote { background: var(--meal-soft); border-radius: 12px; padding: 12px 14px; font-size: .9rem; }
.setrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
:root[data-text="large"] body { font-size: 18.5px; }

/* Brand film */
.film { position: fixed; inset: 0; z-index: 50; background: #0C2B29; color: #F7F5F0; overflow: hidden; font-family: var(--font-display); animation: fadeIn .3s ease-out; }
.film .grain { position: absolute; inset: 0; background: radial-gradient(90% 70% at 50% 40%, #1B5450 0%, #123C3A 50%, #0A2321 100%); }
.film .scene { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 3vmin; text-align: center; opacity: 0; transition: opacity .6s ease; padding: 6vmin; }
.film .scene.on { opacity: 1; }
.film .scene.off { opacity: 0; transition-duration: .45s; }
.film .k-mark { --k-ink: #F7F5F0; width: 22vmin; height: auto; }
.film .big { font-weight: 800; font-size: 13vmin; letter-spacing: -0.04em; line-height: 1; }
.film .ftl { font-weight: 500; font-size: 6vmin; letter-spacing: -0.015em; }
.film .ftl b { color: #F0643A; font-weight: 700; }
.film .kicker { font-size: 2.4vmin; letter-spacing: .3em; text-transform: uppercase; opacity: .7; font-weight: 700; }
.film .scene.on .r1 { animation: rise .7s ease-out .2s both; } .film .scene.on .r2 { animation: rise .7s ease-out .5s both; } .film .scene.on .r3 { animation: rise .7s ease-out .8s both; }
.film .scene .r1, .film .scene .r2, .film .scene .r3 { opacity: 0; }
.film .word { display: inline-block; opacity: 0; }
.film .scene.on .word { animation: rise .55s ease-out both; }
.film .art { width: min(86vw, 120vmin); height: auto; overflow: visible; }
.film .art text { fill: #F7F5F0; font-family: var(--font-body); font-size: 19px; }
.film .art .lbl2 { fill: rgba(247,245,240,.7); font-size: 15px; }
.film .scene.on .drawin { stroke-dasharray: 1; stroke-dashoffset: 1; animation: kDraw 1.6s ease-in-out .2s forwards; }
.film .scene.on .pop { transform-box: fill-box; transform-origin: center; animation: kPop .4s cubic-bezier(.3,1.6,.5,1) both; }
.film .scene.on .fade { animation: fadeIn .5s ease-out both; }
.film .walker { offset-rotate: 0deg; }
.film .scene.on .walker { animation: walk 2.2s ease-in-out .3s both; }
@keyframes walk { from { offset-distance: 0%; } to { offset-distance: 100%; } }
.film .bars rect { fill: #F0643A; transform-box: fill-box; transform-origin: 50% 50%; }
.film .scene.on .bars rect { animation: eq 0.9s ease-in-out infinite alternate; }
@keyframes eq { from { transform: scaleY(.25); } to { transform: scaleY(1); } }
.film .chrome { position: absolute; top: max(14px, env(safe-area-inset-top, 0px)); right: 14px; display: flex; gap: 8px; z-index: 3; }
.film .bar { position: absolute; left: 0; bottom: 0; height: 4px; background: #F0643A; width: 0; z-index: 3; }
.film.rec .chrome, .film.rec .bar { display: none; }
@media (prefers-reduced-motion: reduce) {
  .k-anim .k-stem, .k-anim .k-leg, .k-anim .k-dot, .k-anim .k-ring, .wordmark, .tagline, .herosub, .heroacts { animation-duration: .01s; animation-delay: 0s; }
}
header.top.touring .tripname, header.top.touring .dayrow, header.top.touring .tabs, header.top.touring #aiStatus { display: none; }
.homebtn { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font: inherit; }
.homebtn:focus-visible { outline: 3px solid var(--route); outline-offset: 2px; border-radius: 6px; }
/* Guide: compact stop header, story first, tidy tips */
.stophead { display: flex; gap: 12px; align-items: flex-start; }
.stophead h3, .stophead h2 { margin: 0; }
.stopnum { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: var(--route); border: 3px solid var(--route); background: var(--card); font-variant-numeric: tabular-nums; }
.stopnum.big { width: 44px; height: 44px; font-size: 1.15rem; }
.stopmeta { margin: 2px 0 0; color: var(--muted); font-size: 0.85rem; }

.stopcard { scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 150px); }

@media (max-width: 640px) {
  .top .wrap { padding-block: 8px 0; gap: 6px; }

  .tab { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px 8px; font-size: .72rem; border-bottom: 0; border-top: 3px solid transparent; min-height: 58px; }

  main .wrap { padding-block: 14px calc(150px + env(safe-area-inset-bottom, 0px)); gap: 14px; }
  h2 { font-size: 1.3rem; }
  h3 { font-size: 1.02rem; }
  .card { padding: 14px; gap: 12px; }
  .banner { font-size: .88rem; padding: 10px 12px; flex-wrap: wrap; }
  .daysum { grid-template-columns: repeat(4, minmax(0, 1fr)) !important; }

  .daysum b { font-size: .92rem !important; white-space: normal !important; overflow-wrap: anywhere; line-height: 1.2; }
  .daysum span { font-size: .7rem !important; }

  .toolrow { display: flex !important; flex-wrap: nowrap !important; overflow-x: auto; gap: 8px; scrollbar-width: none; padding-bottom: 2px; }

  .mcta { display: block; position: fixed; left: 12px; right: 12px; bottom: calc(66px + env(safe-area-inset-bottom, 0px)); z-index: 19; }
  .mcta .btn { width: 100%; min-height: 50px; font-size: 1.05rem; box-shadow: 0 6px 18px rgba(0,0,0,.25); background: var(--meal); border-color: var(--meal); color: #fff; }
  .tl .time { font-size: .85rem; }
  body.touring-on .mcta, header.top.touring ~ main .mcta { display: none; }
}
/* First-run walkthrough */

.coach .art { width: 64px; height: 64px; border-radius: 18px; background: var(--route-soft); display: grid; place-items: center; font-size: 2rem; }
.coach .dots { display: flex; gap: 6px; } .coach .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); } .coach .dots i.on { background: var(--route); width: 20px; border-radius: 4px; }
.coach .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }

<script>
const SAMPLE_CITY = {
  city: "Barcelona",
  country: "Spain",
  starts: {
    cruise: [
      { name: "Moll Adossat cruise terminals", lat: 41.3530, lng: 2.1700, note: "Most big ships dock here. A port shuttle bus runs to the Columbus Monument." },
      { name: "World Trade Center cruise terminal", lat: 41.3714, lng: 2.1797, note: "Smaller ships. You can walk into the old town from here." }
    ],
    airport: [
      { name: "Barcelona Airport, Terminal 1", lat: 41.2889, lng: 2.0731, note: "About 30 minutes into the center by taxi or Aerobús." },
      { name: "Barcelona Airport, Terminal 2", lat: 41.3038, lng: 2.0727, note: "About 30 minutes into the center by taxi or Aerobús." }
    ],
    hotel: [
      { name: "Hotel near Plaça de Catalunya", lat: 41.3870, lng: 2.1700 },
      { name: "Hotel on Passeig de Gràcia", lat: 41.3925, lng: 2.1650 },
      { name: "Hotel at Port Olímpic", lat: 41.3868, lng: 2.1963 }
    ],
    station: [
      { name: "Barcelona Sants station", lat: 41.3792, lng: 2.1400, note: "High-speed trains to Madrid, Girona and France." },
      { name: "Estació de França", lat: 41.3843, lng: 2.1856 }
    ],
    point: [
      { name: "Barcelona Sants train station", lat: 41.3792, lng: 2.1400 },
      { name: "Plaça d'Espanya", lat: 41.3751, lng: 2.1490 }
    ]
  },
  sites: [
    { id: "sagrada", name: "Sagrada Família", lat: 41.4036, lng: 2.1744, minutes: 90, kind: "touristy", mustSee: true, category: "Basilica",
      summary: "Gaudí's unfinished basilica, under construction since 1882.",
      guide: "You are standing in front of the most famous building site in the world. Antoni Gaudí took over this church in 1883 and spent the last forty years of his life on it, knowing he would never see it finished. He planned eighteen spires: twelve for the apostles, four for the evangelists, one for Mary and the tallest, for Jesus, which at 172 meters is meant to stay just below the height of Montjuïc hill, because Gaudí felt his work should not rise above God's. Start with the Nativity façade, the one Gaudí finished himself. It faces the sunrise and is crowded with life: turtles carry the columns, birds and plants climb the stone, and the story of Christ's birth unfolds in the middle. Then walk around to the Passion façade, carved decades later by Josep Maria Subirachs, all hard angles and bare bone. Inside, the columns branch like trees, and the stained glass turns the nave blue and green on the east side and orange and red on the west as the sun moves.",
      lookFor: ["The turtle and tortoise carrying columns at the base of the Nativity façade: one from the land, one from the sea.", "The magic square on the Passion façade, where every row adds up to 33, Christ's age at his death.", "Stand in the middle of the nave and look straight up at the ceiling, where the tree columns open into a canopy of light."],
      photoTip: "Cross to the pond in Plaça de Gaudí for the classic reflection shot of the Nativity façade." },
    { id: "parkguell", name: "Park Güell", lat: 41.4145, lng: 2.1527, minutes: 75, kind: "touristy", mustSee: true, category: "Park",
      summary: "Gaudí's hillside garden city, with mosaic terraces and city views.",
      guide: "Park Güell began as a business plan that failed. Count Eusebi Güell wanted a gated garden suburb for wealthy families, with sixty houses on this hill. Only two were built, and the city bought the land in 1922 and opened it as a park. What remains is Gaudí at his most playful. The two gatehouses at the entrance look like gingerbread, and the double staircase is guarded by the famous mosaic lizard, often called the dragon. Above it, the Hypostyle Room was meant to be the market hall: 86 columns hold up the great square, and the ceiling is decorated with mosaic suns made from broken plates and bottles. Up top, the long serpentine bench curves along the terrace. It was shaped by a worker sitting in wet plaster so it would fit the human back. The viaducts through the woods are built from rough stone dug from the site, so they look as if they grew out of the hill.",
      lookFor: ["The mosaic lizard on the main staircase. Look closely at the pieces: they are broken tiles, a technique called trencadís.", "The four large mosaic medallions on the Hypostyle ceiling, each a sun for one season.", "Sit on the serpentine bench and notice how the curve supports your back."],
      photoTip: "From the terrace, frame the gatehouses with the city and the sea behind them." },
    { id: "batllo", name: "Casa Batlló", lat: 41.3917, lng: 2.1650, minutes: 60, kind: "touristy", mustSee: true, category: "Gaudí house",
      summary: "The 'house of bones', a dragon of a building on Passeig de Gràcia.",
      guide: "Locals call this the House of Bones, and once you see the balconies you will know why: they look like skulls, and the pillars on the ground floor look like bones. Gaudí remodelled an ordinary 1870s building for the textile family Batlló between 1904 and 1906, and almost nothing inside has a straight line. The most popular reading of the façade is the legend of Saint George, patron saint of Catalonia. The roof is the dragon's back, with scaly tiles that shift from green to blue to pink. The cross on the tower is the saint's lance, and the skull balconies are the dragon's victims. Inside, the light well is tiled in blues that get darker toward the top, so the light feels even on every floor. It is a small engineering trick that still works today.",
      lookFor: ["The roof ridge: rounded tiles like scales, with the cross-topped tower as Saint George's lance.", "Balconies shaped like masks or skulls.", "In the light well, notice the tiles fading from pale to deep blue as you look up."],
      photoTip: "Stand across Passeig de Gràcia in the late afternoon when the sun lights the façade." },
    { id: "pedrera", name: "Casa Milà (La Pedrera)", lat: 41.3954, lng: 2.1620, minutes: 60, kind: "touristy", mustSee: false, category: "Gaudí house",
      summary: "A rippling stone apartment block with a rooftop of warrior chimneys.",
      guide: "When Casa Milà was finished in 1912, people mocked it. They called it La Pedrera, the stone quarry, because its pale wavy façade looked like a cliff face. Today it is one of the most loved buildings in the city. Gaudí built it without any load-bearing walls inside, using a frame of columns and arches, so the owners could move the walls around as they wished. That was decades ahead of its time. The iron balconies look like tangled seaweed and were designed with the sculptor Josep Maria Jujol. The best part is the roof. Climb up and you walk among chimneys and ventilation towers that look like helmeted guards. Under the roof, the attic is held up by 270 brick arches, shaped like the ribs of a whale.",
      lookFor: ["The 'warrior' chimneys on the roof. Some say they inspired the Star Wars stormtroopers.", "The seaweed-like wrought-iron balconies on the façade.", "The brick arches in the attic, each a slightly different height."],
      photoTip: "From the corner of Carrer de Provença you can fit the whole wavy façade in one frame." },
    { id: "gothic", name: "Gothic Quarter & Cathedral", lat: 41.3840, lng: 2.1762, minutes: 60, kind: "touristy", mustSee: true, category: "Old town",
      summary: "Narrow medieval lanes around Barcelona's cathedral, on top of the Roman town.",
      guide: "This is where Barcelona began. Two thousand years ago the Romans built a walled town called Barcino on this low hill, and you can still find pieces of its wall and four columns of its temple hidden in the lanes. The Cathedral of the Holy Cross and Saint Eulàlia was built from the 1200s to the 1400s, though the grand front you see today was only finished in the late 1800s. Step inside and then into the cloister, where thirteen white geese live. They stand for the thirteen years of Eulàlia, a girl martyred by the Romans, who is buried in the crypt. On Sunday mornings, locals dance the sardana, a slow Catalan circle dance, in the square in front. Let yourself get a little lost in the alleys around here. It is the best way to see it.",
      lookFor: ["The thirteen white geese in the cathedral cloister.", "Roman wall stones and towers along Plaça Nova and Carrer de la Tapineria.", "Buy a ticket to ride the lift to the cathedral roof for a view over the old town."],
      photoTip: "The Pont del Bisbe, a carved stone bridge on Carrer del Bisbe, is the most photographed corner of the quarter." },
    { id: "rambla", name: "La Rambla & La Boqueria market", lat: 41.3818, lng: 2.1716, minutes: 45, kind: "touristy", mustSee: false, category: "Street & market",
      summary: "The famous boulevard and the city's great food market.",
      guide: "La Rambla follows the line of an old stream that once ran along the medieval city wall, which is why it is so long and straight. Today it is a tree-lined promenade running 1.2 kilometers from Plaça de Catalunya down to the sea. Halfway down, you walk over a round mosaic set into the pavement by Joan Miró, placed there in 1976 to welcome people arriving from the port. Just before it is La Boqueria, under its iron and stained-glass entrance. Food has been sold here since at least the 1200s. Walk past the juice stands at the front, which are mostly for visitors, and go deeper inside, where locals buy fish, ham and wild mushrooms. A fair warning: La Rambla is famous for pickpockets, so keep your bag in front of you.",
      lookFor: ["Joan Miró's round pavement mosaic in front of the Liceu metro stop.", "The ham stalls at La Boqueria, where whole legs of jamón ibérico hang above the counters.", "The dragon and umbrellas on the Casa Bruno Cuadros building, opposite the Liceu."],
      photoTip: "Shoot the Boqueria's stained-glass entrance from across La Rambla to get the crowd in the frame." },
    { id: "picasso", name: "Museu Picasso", lat: 41.3852, lng: 2.1810, minutes: 75, kind: "touristy", mustSee: false, category: "Museum",
      summary: "Picasso's early years in five medieval palaces on Carrer de Montcada.",
      guide: "Picasso lived in Barcelona as a teenager, from 1895 to 1904, and this is where he became an artist. The museum opened in 1963, the first one dedicated to him in his lifetime, and it fills five connected medieval mansions on Carrer de Montcada. It is strongest on his early work, so you will see a version of Picasso you may not expect: careful academic portraits painted at fifteen, including Science and Charity, which he painted at that age. Then come the moody Blue Period works. The highlight for many people is a room of 58 paintings from 1957 where Picasso took apart Velázquez's Las Meninas over and over, like a jazz musician playing variations on a tune. Book a timed ticket in advance. Entry is free on Thursday evenings and the first Sunday of the month.",
      lookFor: ["Science and Charity, painted when Picasso was fifteen.", "The Las Meninas series: count how many ways he paints the little princess.", "The stone courtyards of the medieval palaces themselves."],
      photoTip: "Photos inside the galleries are limited, but the Gothic courtyards are perfect for a shot." },
    { id: "smdm", name: "Santa Maria del Mar", lat: 41.3838, lng: 2.1820, minutes: 30, kind: "local", mustSee: false, category: "Church",
      summary: "The 'cathedral of the sea', built by the dockworkers of El Born.",
      guide: "Many Barcelonans will tell you this, and not the cathedral, is the city's most beautiful church. Santa Maria del Mar was built remarkably fast, in just 54 years, from 1329 to 1383, which is why it is so pure an example of Catalan Gothic. The people of this waterfront neighborhood paid for it, and the port porters, called bastaixos, carried the stones on their backs from the quarry on Montjuïc. You will find them carved into the main doors and in bronze reliefs inside. The interior feels enormous because the columns are slim and widely spaced, about 13 meters apart. In 1936 the church burned for eleven days, and the fire destroyed its decoration. That loss left the bare, soaring stone you see now.",
      lookFor: ["The figures of the stone-carrying porters on the bronze main doors.", "The great rose window above the entrance, best with afternoon light.", "The slim octagonal columns: try to wrap your arms around one."],
      photoTip: "Sit in the back pews and shoot up the nave toward the altar." },
    { id: "palau", name: "Palau de la Música Catalana", lat: 41.3875, lng: 2.1753, minutes: 50, kind: "touristy", mustSee: false, category: "Concert hall",
      summary: "A concert hall made of light, with a stained-glass sun in the ceiling.",
      guide: "This is the only concert hall in Europe lit entirely by daylight during the day. Lluís Domènech i Montaner, a rival of Gaudí, designed it for a Catalan choral society, and it opened in 1908. Outside, the corner sculpture shows Catalan folk song, with Saint George guarding it. Inside the auditorium, the walls are mostly glass. Above you hangs an inverted dome of stained glass, a golden sun surrounded by a ring of women's faces, like a giant drop about to fall. On one side of the stage, busts of Beethoven and Wagner's Valkyries burst out of the wall. On the other is a tree and a bust of a Catalan composer. The back wall holds eighteen muses, half carved and half mosaic, playing instruments. Guided tours run daily, or catch a concert in the evening.",
      lookFor: ["The inverted stained-glass dome in the ceiling.", "The galloping Valkyries above the stage, bursting out of the wall.", "The mosaic columns on the façade, each in a different flower pattern."],
      photoTip: "Shoot the corner façade from Carrer de Sant Pere Més Alt to catch the sculpture group." },
    { id: "santpau", name: "Sant Pau Recinte Modernista", lat: 41.4116, lng: 2.1744, minutes: 60, kind: "local", mustSee: false, category: "Architecture",
      summary: "A fairy-tale hospital campus of tiled pavilions, often skipped by crowds.",
      guide: "This looks like a palace city, but it was built as a hospital. Domènech i Montaner, the architect of the Palau de la Música, designed it between 1902 and 1930 on the idea that beauty and fresh air help people heal. Instead of one big building, he made a garden of separate pavilions, connected underground by tunnels so patients could be moved out of the weather. Every pavilion is covered in mosaic domes, colored tile, and sculpted angels. It worked as a hospital until 2009 and is now a museum and a cultural center. It sits a short walk up Avinguda de Gaudí from the Sagrada Família, so it is easy to pair the two, and it is far calmer.",
      lookFor: ["The tiled domes of the pavilions, each slightly different.", "The underground tunnels that linked the wards.", "Look back down Avinguda de Gaudí for a view of the Sagrada Família."],
      photoTip: "The Avinguda de Gaudí is a pedestrian street lined with trees, so you can frame both buildings in one shot." },
    { id: "bunkers", name: "Bunkers del Carmel", lat: 41.4192, lng: 2.1617, minutes: 45, kind: "local", mustSee: false, category: "Viewpoint",
      summary: "A Civil War gun battery with the best free 360° view of the city.",
      guide: "Locals come up here at sunset with a drink, and it is easy to see why. From the top of Turó de la Rovira you can see the whole city: the Sagrada Família, the sea, Montjuïc and the Collserola hills. During the Spanish Civil War, in 1938, this hill held an anti-aircraft battery that defended Barcelona from bombers. After the war, people who had moved to the city with nowhere to live built shacks among the ruins. The neighborhood lasted until 1990. The concrete platforms you sit on are what's left of the gun emplacements. It is a steep climb from the nearest bus stop, so wear good shoes, and bring water. The small museum explains the history.",
      lookFor: ["The round concrete gun platforms of the 1938 battery.", "Find the Sagrada Família, Torre Glòries and Montjuïc from the top.", "Remains of the shanty town's floor tiles, in the ground near the top."],
      photoTip: "Come for golden hour and face southeast for the Sagrada Família against the sea." },
    { id: "gracia", name: "Gràcia squares", lat: 41.4010, lng: 2.1575, minutes: 45, kind: "local", mustSee: false, category: "Neighborhood",
      summary: "A village inside the city: small squares, terraces and local life.",
      guide: "Gràcia was its own town until 1897, when Barcelona swallowed it up, and in many ways it still acts like a village. Its streets are narrow and its life happens in little squares. Plaça del Sol is the busiest, full of café terraces and young people in the evening. Plaça de la Vila de Gràcia has a clock tower that's the symbol of the neighborhood, and Plaça de la Virreina is quieter, with a church and a few good bars. This is a great place to see how Barcelonans actually spend an afternoon. In mid-August the Festa Major de Gràcia takes over, when each street competes to decorate itself in a theme, often using recycled materials.",
      lookFor: ["The clock tower in Plaça de la Vila de Gràcia.", "Small independent shops and old bodegas along Carrer de Verdi.", "Casa Vicens, Gaudí's first house, a few blocks away on Carrer de les Carolines."],
      photoTip: "Shoot from a terrace in Plaça de la Virreina with the church in the background." },
    { id: "santantoni", name: "Mercat de Sant Antoni", lat: 41.3786, lng: 2.1617, minutes: 30, kind: "local", mustSee: false, category: "Market",
      summary: "The locals' market: an iron cross-shaped hall, without the tour groups.",
      guide: "If La Boqueria is the market everyone visits, Sant Antoni is the one Barcelonans actually shop in. Its huge iron hall, shaped like a cross, opened in 1882 and was restored in 2018. During the work, builders found pieces of the 17th-century city wall underneath, and you can see them in the basement. The market is in three parts: fresh food in the middle, clothing and household stalls around the outside, and on Sunday mornings a famous secondhand book, coin and comic market. The streets around it are now one of the city's best areas for food, with vermouth bars and little restaurants.",
      lookFor: ["The 17th-century wall remains in the basement.", "The iron roof structure and the central cupola.", "On Sundays, the book and collectors' market around the outside."],

    { id: "ciutadella", name: "Parc de la Ciutadella", lat: 41.3881, lng: 2.1874, minutes: 40, kind: "local", mustSee: false, category: "Park",

    { id: "mnac", name: "MNAC & Magic Fountain", lat: 41.3685, lng: 2.1534, minutes: 60, kind: "touristy", mustSee: false, category: "Museum",

      guide: "The Prado holds the Spanish royal collection, gathered by kings over five centuries. Head first for Velázquez's Las Meninas, in Room 12. It shows the little princess Margarita with her maids, a dwarf and a dog, while Velázquez himself paints at a huge canvas, and the king and queen appear only in a mirror at the back, as if standing where you are. Then find Goya, from his sunny tapestry designs to the Third of May 1808, a man in a white shirt facing a firing squad with his arms raised. Downstairs are Goya's Black Paintings, painted on the walls of his house in old age. Don't miss El Greco's stretched, glowing saints, and Bosch's Garden of Earthly Delights.",
      lookFor: ["Velázquez painting himself into Las Meninas, and the king and queen in the mirror.", "The man in the white shirt in Goya's Third of May.", "The strange creatures in Bosch's Garden of Earthly Delights."],

      picks: [{ k: "timing", t: "On Wednesdays (and some Saturdays) at 11:00 there's a changing of the guard at the palace gate." }, { k: "spot", t: "The Sabatini Gardens beside the palace are free and lovely at sunset." }] },
    { id: "mayor", name: "Plaza Mayor and Puerta del Sol", lat: 40.4155, lng: -3.7074, minutes: 40, kind: "touristy", mustSee: true, category: "Square",
      summary: "The grand arcaded square and the bustling center of Spain.",
      guide: "Plaza Mayor, finished in 1619, is a vast enclosed square ringed by arcades and 237 balconies. Over the centuries it hosted bullfights, royal celebrations and even trials of the Spanish Inquisition. Look for the painted façade of the Casa de la Panadería on the north side. Walk five minutes east to Puerta del Sol, the busy heart of Madrid. A plaque on the ground in front of the old post office marks Kilometer Zero, the point from which all of Spain's roads are measured, and nearby is the statue of the bear and the strawberry tree, the city's symbol.",
      lookFor: ["The painted Casa de la Panadería.", "The Kilometer Zero plaque in Sol.", "The bear and strawberry tree statue."], photoTip: "From the middle of Plaza Mayor toward the painted façade.",

    { id: "retiro", name: "Retiro Park", lat: 40.4153, lng: -3.6845, minutes: 60, kind: "local", mustSee: false, category: "Park",
      summary: "Madrid's great park, with a boating lake and a glass palace.",
      guide: "The Retiro was a royal retreat until 1868, when it opened to the public. Today it's where Madrid relaxes. Rent a rowing boat on the big lake, beneath the monument to King Alfonso XII, then walk to the Crystal Palace, a glass and iron greenhouse from 1887 that now hosts art exhibitions. In the rose garden you'll find the Fallen Angel fountain, said to be one of the few public statues of the devil in the world.",

    { id: "reinasofia", name: "Reina Sofía Museum (Guernica)", lat: 40.4086, lng: -3.6943, minutes: 75, kind: "touristy", mustSee: false, category: "Museum",
      summary: "Modern art, and Picasso's Guernica.",
      guide: "This museum of modern art is home to Picasso's Guernica, one of the most powerful paintings of the 20th century. Picasso painted it in 1937 after German and Italian planes bombed the Basque town of Guernica during the Spanish Civil War. It's huge, almost eight meters wide, and painted only in black, white and grey: a screaming mother with her dead child, a fallen soldier, a horse in agony and a bull. There are also works by Dalí and Miró.",

    { id: "sanginés", name: "Chocolatería San Ginés", lat: 40.4170, lng: -3.7068, minutes: 25, kind: "touristy", mustSee: false, category: "Food stop",

      guide: "San Ginés has served churros and thick hot chocolate since 1894, around the clock for much of its history. Madrileños come here after a night out, and visitors come any time. Order 'chocolate con churros' and dip the crisp fried dough into chocolate thick enough to stand a spoon in. Try the porras too, a thicker churro.",

    { id: "almudena", name: "Almudena Cathedral", lat: 40.4157, lng: -3.7146, minutes: 25, kind: "local", mustSee: false, category: "Cathedral",
      summary: "Madrid's cathedral, over a century in the making.",
      guide: "Madrid only got a cathedral in 1993, when Pope John Paul II consecrated this one after 110 years of work. Outside it looks classical to match the palace; inside the ceilings are painted in bold modern colors. It's dedicated to the Virgin of the Almudena, Madrid's patron, whose statue legend says was hidden in the city walls during the Moorish era and found again in 1085.",
      lookFor: ["The colorful modern ceiling.", "The statue of the Virgin of the Almudena.", "The crypt below, one of the oldest parts."], photoTip: "From the palace square, the cathedral's dome.",

    id: "theatre-dionysus", name: "Theatre of Dionysus", lat: 37.9703, lng: 23.7278, minutes: 30, kind: "touristy", mustSee: false, category: "Ancient theater",
    summary: "The birthplace of Western theater, on the south slope of the Acropolis.",
    guide: "You are sitting where drama was born. Every spring Athens honored Dionysus, god of wine and theater, with a festival of plays, and the great tragedies of Aeschylus, Sophocles and Euripides, and the comedies of Aristophanes, were first performed on this slope, at first on wooden seats. The stone theater around you was built in the 330s BC and held perhaps fifteen thousand people. Look at the front row: carved marble thrones were reserved for priests and officials, and the grandest one, in the very center, belonged to the priest of Dionysus himself. Then look at the stage front, carved in Roman times with scenes from the god's life. Sit for a moment, look up at the Acropolis rock above you, and picture a whole city laughing and weeping together.",

    id: "promenade", name: "Acropolis promenade (Dionysiou Areopagitou and Apostolou Pavlou)", lat: 37.9700, lng: 23.7235, minutes: 30, kind: "local", mustSee: false, category: "Walk",
    summary: "The car-free walk that circles below the Acropolis, past cafés, olive trees and views.",
    guide: "This wide, car-free walkway is how Athenians stroll around their ancient heart. It was pedestrianized for the 2004 Olympics and joins the main archaeological sites, so you can walk from the Acropolis Museum, past the Theatre of Dionysus and the Odeon of Herodes Atticus, all the way to the Ancient Agora without crossing traffic. Notice the street names. The first part is Dionysiou Areopagitou, named for Dionysius the Areopagite, the Athenian judge who believed when Paul preached on the hill above. The second part is Apostolou Pavlou, Apostle Paul Street. In the evening locals walk, street musicians play, and the Acropolis lights up above you. It's the best free show in Athens.",

    id: "agia-ekaterini", name: "Agia Ekaterini (St Catherine's Church)", lat: 37.9706, lng: 23.7304, minutes: 20, kind: "local", mustSee: false, category: "Byzantine church",
    summary: "A small 11th-century Byzantine church in Plaka, sunk below street level among Roman columns.",
    guide: "Step down into this little courtyard and you're standing below the level of the modern street, at the height of Byzantine Athens. Agia Ekaterini was built in the 11th century, and its domed shape and brick patterns are classic Middle Byzantine work. In front of it stand two Roman columns, remains of an older building that once stood here, so this one spot holds Roman, Byzantine and modern Athens together. The church is named for Saint Catherine because in 1767 it was given to the famous Monastery of Saint Catherine on Mount Sinai. It's still a working parish church, so step inside quietly, light a candle if you wish, and notice how dim and warm it feels compared with the bright marble of the Acropolis.",

  {
    id: "kapnikarea", name: "Panagia Kapnikarea", lat: 37.9762, lng: 23.7285, minutes: 15, kind: "local", mustSee: false, category: "Byzantine church",
    summary: "An 11th-century Byzantine church standing in the middle of Ermou, Athens' busiest shopping street.",
    guide: "Shoppers stream around this little church every day, but it was here long before any of them. Panagia Kapnikarea was built in the 11th century and is dedicated to the Presentation of the Virgin Mary in the Temple. When Athens was replanned as Greece's new capital in the 1830s, the church stood in the way of the new Ermou Street and was going to be demolished. It was saved, the story goes, by King Ludwig of Bavaria, father of Greece's first king, Otto. So the street was built around it, and that's why it sits in the middle of the road. Inside, the paintings are modern, by Fotis Kontoglou, who revived the true Byzantine icon style in the 20th century. Step in, let your eyes adjust, and find the Virgin in the apse.",

  {
    id: "roman-agora", name: "Roman Agora and Tower of the Winds", lat: 37.9744, lng: 23.7263, minutes: 40, kind: "touristy", mustSee: false, category: "Ancient site",
    summary: "The Roman-era marketplace, with an ancient weather station and water clock.",
    guide: "When Rome ruled Athens, the city's market moved here. Julius Caesar and then Augustus paid for this square, finished around the time of Christ's birth, and you can still walk through its grand west gate, the Gate of Athena Archegetis. But the star is the octagonal marble tower at the east end, the Tower of the Winds, built in the 1st century BC by the astronomer Andronikos of Kyrrhos. Each of its eight sides faces a compass direction and is carved with the god of that wind. Bearded, heavy-cloaked Boreas blows cold from the north, and gentle young Zephyros scatters flowers from the west. Below them are sundial lines, and inside was a water clock fed from the Acropolis, so this was a clock, a compass and a weather vane in one.",

    id: "nam", name: "National Archaeological Museum", lat: 37.9890, lng: 23.7327, minutes: 120, kind: "touristy", mustSee: false, category: "Museum",
    summary: "Greece's greatest museum of ancient art, from gold masks to the world's oldest computer.",
    guide: "If you want to see the treasures of ancient Greece in one building, this is the place. Start with the Mycenaean room and the gold death mask that Heinrich Schliemann called the Mask of Agamemnon, more than 3,000 years old. Then find the bronze god from Artemision, probably Zeus, about to hurl a thunderbolt, his arms stretched wide in perfect balance, pulled from the sea in the 20th century. Nearby is the little bronze Jockey of Artemision, a boy on a galloping horse. And don't miss the Antikythera Mechanism, corroded gears found in a shipwreck, now known to be an ancient device for predicting eclipses and the movements of the heavens. It's often called the world's first computer.",

    summary: "Icons, mosaics and frescoes telling the story of Christianity in Greece.",
    guide: "This museum tells the story of how the Greek world became Christian, and it does it beautifully. You start with early Christian carvings and the first symbols believers used, the fish, the dove and the Good Shepherd, then move into the Byzantine centuries, with gold-leaf icons, whole painted church walls, mosaics, embroidered vestments and illuminated manuscripts. Some icons were carried out of Constantinople and Asia Minor by refugees, so each has a journey behind it. The building is a story too: the villa was built in the 1840s for the Duchess of Plaisance, a French aristocrat who loved Athens. Take your time in front of one icon, look at the eyes, and remember that for Orthodox Christians an icon is a window, not just a painting.",

  }
  if (act === "prevday" || act === "nextday") {
    if (view === "trip") readForm();
    trip.active = Math.max(0, Math.min(trip.days.length - 1, trip.active + (act === "nextday" ? 1 : -1)));
    aiError = ""; cdPreview = null; cdWhere = null; stopAudio(); save(); render(); return;
  }
  if (act === "addport") {
    readForm();
    const cur = day();
    const nd = newDay({ destination: "", date: cur.date ? addDays(cur.date, 1) : "", type: "port", portArrive: "08:00", allAboard: "17:00" });
    trip.days.splice(trip.active + 1, 0, nd); trip.active++; view = "trip"; edited(); save(); render();
    const el = document.getElementById("f-dest"); if (el) { el.focus(); el.placeholder = "Port name, e.g. Kotor"; }

  }

document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset && t.dataset.site) {
    const d = day(), id = t.dataset.site;
    d.selected = d.selected || [];
    if (t.checked) { if (!d.selected.includes(id)) d.selected.push(id); } else d.selected = d.selected.filter(x => x !== id);
    save(); render(); return;
  }

    return;
  }
  if (t.id === "w-img" && t.files && t.files[0]) {
    readWiz(); const f = t.files[0];
    shrinkImage(f, 1600).then(url => { const bin = atob(url.split(",")[1]), arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i); wiz.images = wiz.images || []; wiz.images.push({ url, blob: new Blob([arr], { type: "image/jpeg" }) }); render(); })
      .catch(() => { aiError = "That photo couldn't be read. Try a JPEG or PNG."; render(); });
    return;
  }
  if (t.id === "f-rain") { day().rain = t.checked; save(); render(); return; }

  if (t.id === "p-party") { trip.prefs = P(); trip.prefs.party = Math.max(1, Math.min(20, +t.value || 2)); save(); render(); return; }
  if (t.dataset && t.dataset.note) { jUpdate(t.dataset.note, j => { j.note = t.value; }); return; }
  if (t.dataset && t.dataset.photo && t.files && t.files[0]) {
    const sid = t.dataset.photo;
    shrinkImage(t.files[0]).then(url => { jUpdate(sid, j => { j.photos = j.photos || []; if (j.photos.length < 4) j.photos.push(url); }); renderGuideOnly(); })
      .catch(() => { aiError = "That photo couldn't be read. Try a JPEG or PNG."; render(); });
    return;
  }
  if (t.id === "f-type") { readForm(); const d = day(); d.type = t.value; d.pointIdx = 0; if (d.type === "departure" && d.mode === "ship") d.mode = "flight"; d.selected = null; edited(); save(); render(); return; }
  if (["f-point", "f-return", "f-along", "f-fill", "f-lodging", "f-tender", "f-date"].includes(t.id)) { readForm(); edited(); save(); render(); return; }

});
document.addEventListener("submit", e => {
  e.preventDefault();

  }
  if (f.dataset.ask) {
    const city = cityFor(day()); const s = f.dataset.ask === "day" ? null : allSites(city).find(x => x.id === f.dataset.ask);
    if (s || f.dataset.ask === "day") askGuide(s, city, f.querySelector("input").value);
  }
});

render();
})();
